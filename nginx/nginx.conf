server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # SPA fallback — all non-asset routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # The SPA's own OAuth landing route, not a backend one — it must serve
    # index.html rather than be proxied like the rest of /auth/*, which would
    # 404. The backend redirects to the hash form (/#/auth/callback, see
    # AuthController.frontendRoute) so this normally isn't hit; it stays as the
    # fallback for old links and for a backend not yet redeployed, which
    # src/oauthRedirectBridge.ts then rewrites into the hash route.
    #
    # Must be declared before the /auth/ proxy below. nginx always prefers an
    # exact match over a prefix match, so this wins regardless of block order,
    # but keep it here for readability.
    location = /auth/callback {
        try_files $uri /index.html;
    }

    # Auth OAuth routes
    location /auth/ {
        proxy_pass http://backend:3000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── MCP: OAuth 2.1 Authorization Server + the /mcp resource server ────────
    # See `src/main.ts` (backend) — these are the exact root-level paths the
    # MCP SDK's `mcpAuthRouter` fixes per spec (RFC 8414/9728/7591), reached
    # directly by an external AI client, never through the SPA's own
    # /api-prefixed calls.

    # The SPA's own consent screen, not a backend route — same carve-out
    # reasoning as /auth/callback above, and for the same reason: it must
    # win over any proxy block below rather than 404 against the backend.
    # nginx prefers an exact match regardless of declaration order, but kept
    # here, before /mcp and /.well-known/, for readability.
    location = /oauth/consent {
        try_files $uri /index.html;
    }

    location /mcp {
        proxy_pass http://backend:3000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Streamable HTTP can hold a GET open for server-initiated
        # notifications — buffering would delay every chunk until nginx's
        # buffer fills, and the default read timeout would cut the stream.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /.well-known/oauth-authorization-server {
        proxy_pass http://backend:3000/.well-known/oauth-authorization-server;
        proxy_set_header Host $host;
    }

    location /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://backend:3000/.well-known/oauth-protected-resource/mcp;
        proxy_set_header Host $host;
    }

    location = /authorize {
        proxy_pass http://backend:3000/authorize;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /token {
        proxy_pass http://backend:3000/token;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /register {
        proxy_pass http://backend:3000/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /revoke {
        proxy_pass http://backend:3000/revoke;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
