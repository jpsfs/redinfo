# Branches represent environments: pushing to env/staging or env/production builds
# images and redeploys that environment via Helm. `dev` is Docker Compose only and
# is not deployed by this pipeline — see deploy/redinfo/README.md.
trigger:
  branches:
    include:
      - env/staging
      - env/production

variables:
  # Azure DevOps SSH service connection ID or name
  SSH_SERVICE_CONNECTION: "ffb6f58f-b7ba-49d3-bb90-001211d610b7" # SSH RedCross (Liberty-Server)
  # Docker Hub service connection ID or name
  DOCKER_SERVICE_CONNECTION: "74055803-059c-40b0-bb65-0318f1294758" # Docker Hub Registry

  # Root-level fallback for variables that are deliberately absent from some
  # environments' variable groups (redinfo-staging never defines these — see
  # the comment above `secrets:` in values.staging.yaml). Azure Pipelines does
  # NOT expand $(VAR) to an empty string when a variable doesn't exist
  # anywhere in scope — it leaves the literal text "$(VAR)" in place, which is
  # a non-empty string. deploy-env.yml's env: mapping passes that straight
  # through as a real value, so app code checking "is this configured" via a
  # truthiness check (e.g. WebPushChannelService) sees garbage and thinks it
  # IS configured, then crashes trying to use it. A stage/group-level variable
  # of the same name (redinfo-production has all five) takes precedence over
  # this root default, so production is unaffected.
  RESEND_API_KEY: ""
  NOTIFICATION_EMAIL_FROM: ""
  VAPID_PUBLIC_KEY: ""
  VAPID_PRIVATE_KEY: ""
  VAPID_SUBJECT: ""

stages:
  - stage: BuildAndPush
    displayName: Build and push images ($(Build.SourceBranchName))
    jobs:
      - job: BuildPushImages
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: Docker@2
            displayName: "Build and push backend image"
            inputs:
              containerRegistry: "$(DOCKER_SERVICE_CONNECTION)"
              repository: "jpsfs/redinfo-backend"
              command: "buildAndPush"
              Dockerfile: "packages/backend/Dockerfile"
              # Use repository root as build context since the backend Dockerfile copies files from the repo root
              buildContext: "$(Build.SourcesDirectory)"
              tags: |
                $(Build.BuildId)
                $(Build.SourceBranchName)

          - task: Docker@2
            displayName: "Build and push frontend image"
            inputs:
              containerRegistry: "$(DOCKER_SERVICE_CONNECTION)"
              repository: "jpsfs/redinfo-frontend"
              command: "buildAndPush"
              Dockerfile: "packages/frontend/Dockerfile"
              buildContext: "$(Build.SourcesDirectory)"
              # Build only the production stage so the dev stage is never run in CI.
              # The dev stage is used by docker compose locally only.
              arguments: "--target prod"
              tags: |
                $(Build.BuildId)
                $(Build.SourceBranchName)

          - task: Docker@2
            displayName: "Build and push legacy-migration job image"
            inputs:
              containerRegistry: "$(DOCKER_SERVICE_CONNECTION)"
              repository: "jpsfs/redinfo-legacy-migration"
              command: "buildAndPush"
              Dockerfile: "packages/legacy-migration/Dockerfile"
              buildContext: "$(Build.SourcesDirectory)"
              # `job`, not the default `base` target: bundles its own throwaway
              # MariaDB (see job-entrypoint.sh) — `base` is what docker-compose.
              # migration.yml uses locally against a separately-run mysql-legacy.
              arguments: "--target job"
              tags: |
                $(Build.BuildId)
                $(Build.SourceBranchName)

  - stage: DeployStaging
    displayName: Deploy to staging
    dependsOn: BuildAndPush
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/env/staging'))
    variables:
      - group: redinfo-staging
    jobs:
      - deployment: DeployToStaging
        displayName: Deploy Helm chart to staging
        pool:
          vmImage: "ubuntu-latest"
        environment: redinfo-staging
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/deploy-env.yml
                  parameters:
                    envName: staging
                    sshServiceConnection: $(SSH_SERVICE_CONNECTION)
                    imageTag: $(Build.BuildId)

  - stage: DeployProduction
    displayName: Deploy to production
    dependsOn: BuildAndPush
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/env/production'))
    variables:
      - group: redinfo-production
    jobs:
      - deployment: DeployToProduction
        displayName: Deploy Helm chart to production
        pool:
          vmImage: "ubuntu-latest"
        # Attach a manual approval check to this ADO Environment when production
        # goes live — no YAML change needed, it's configured on the Environment itself.
        environment: redinfo-production
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/deploy-env.yml
                  parameters:
                    envName: production
                    sshServiceConnection: $(SSH_SERVICE_CONNECTION)
                    imageTag: $(Build.BuildId)
