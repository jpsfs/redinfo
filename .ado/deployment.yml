# Branches represent environments: pushing to env/staging or env/production builds
# images and redeploys that environment via Helm. `dev` is Docker Compose only and
# is not deployed by this pipeline — see deploy/redinfo/README.md.
#
# Pass 2 redesign — see .ado/README.md for the full picture. Short version:
#   - Images are tagged by commit (`sha-<shortSha>`), not by Build.BuildId, so the
#     *same* image can be promoted from staging to production by fast-forwarding
#     the commit rather than rebuilding it.
#   - `Prepare` decides, once, whether this commit's images already exist, whether
#     they've already passed a staging smoke check, and whether this run should
#     touch deploy stages at all — every other stage reads its outputs instead of
#     re-deriving anything.
#   - `Build` only runs when there's something to build (or `forceRebuild`).
#   - `PromotionGate` refuses to deploy to production a commit that never had a
#     green, smoke-tested staging deploy — unless `forceProduction` overrides it.
#   - `GenerateManuals` is routed by commit message alone, or the manual
#     `forceGenerateManuals` override, and can never block or gate a deploy —
#     see its own comment below.
trigger:
  branches:
    include:
      - dev
      - env/staging
      - env/production

parameters:
  # Manual-run-only escape hatches — a push can never set these (there is no
  # `trigger:` mechanism for pipeline parameters; only "Run pipeline" in the UI,
  # `az pipelines run --parameters`, or the REST API's `templateParameters` can).
  - name: forceProduction
    displayName: "Force production deploy without a verified staging pass (see PromotionGate)"
    type: boolean
    default: false
  - name: forceRebuild
    displayName: "Rebuild and re-push all four images even if sha-<shortSha> already exists"
    type: boolean
    default: false
  - name: forceGenerateManuals
    displayName: "Regenerate manuals even without a docs commit"
    type: boolean
    default: false
  - name: deployToContabo
    displayName: "Also deploy production to the Contabo host on this run (normally driven by CONTABO_DEPLOY_ENABLED)"
    type: boolean
    default: false
  - name: contaboBackgroundJobs
    displayName: "On the Contabo host, also run the legacy-migration cron and the INEM worker (read DeployProductionContabo first)"
    type: boolean
    default: false

variables:
  # Docker Hub service connection ID or name
  DOCKER_SERVICE_CONNECTION: "74055803-059c-40b0-bb65-0318f1294758" # Docker Hub Registry

stages:
  # ── Prepare — decide routing once, let every other stage read it ────────────
  - stage: Prepare
    displayName: Resolve build routing
    jobs:
      - job: Resolve
        pool:
          vmImage: "ubuntu-latest"
        steps:
          # Shallow checkout, not `checkout: none`: EmitVars below reads the tip
          # commit's subject with `git log -1 --format=%s` rather than the
          # Build.SourceVersionMessage predefined variable, which is unreliable/
          # empty in jobs that skip checkout.
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: "Login to Docker Hub"
            inputs:
              containerRegistry: "$(DOCKER_SERVICE_CONNECTION)"
              command: "login"

          - task: Bash@3
            name: EmitVars
            displayName: "Resolve shortSha / imagesExist / stagingVerified / isDocsCommit"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail

                # docker manifest inspect is gated behind the CLI's experimental
                # flag on some Docker versions still in the hosted images.
                export DOCKER_CLI_EXPERIMENTAL=enabled

                shortSha="$(echo "$(Build.SourceVersion)" | cut -c1-8)"

                images=(backend frontend legacy-migration inem-worker)
                imagesExist=true
                for img in "${images[@]}"; do
                  if ! docker manifest inspect "jpsfs/redinfo-${img}:sha-${shortSha}" >/dev/null 2>&1; then
                    imagesExist=false
                    break
                  fi
                done

                stagingVerified=false
                if docker manifest inspect "jpsfs/redinfo-backend:staging-ok-${shortSha}" >/dev/null 2>&1; then
                  stagingVerified=true
                fi

                # Conventional Commits `docs` type, optional scope, optional `!`
                # (breaking-change marker) — e.g. "docs(manual-operador): ...".
                # Read via `git log`, not Build.SourceVersionMessage: the latter
                # is truncated/unreliable and empty on jobs with no checkout.
                commitSubject="$(git log -1 --format=%s)"
                isDocsCommit=false
                # The pattern must be in a variable, not inlined literally on the
                # right of =~ — bash's own parser (not the regex engine) chokes on
                # the parentheses otherwise ("syntax error in conditional
                # expression"), independent of them being escaped for the regex.
                docsCommitPattern='^docs(\([^)]*\))?!?:'
                if [[ "${commitSubject}" =~ ${docsCommitPattern} ]]; then
                  isDocsCommit=true
                fi

                echo "shortSha=${shortSha}"
                echo "imagesExist=${imagesExist}"
                echo "stagingVerified=${stagingVerified}"
                echo "isDocsCommit=${isDocsCommit}"

                echo "##vso[task.setvariable variable=shortSha;isOutput=true]${shortSha}"
                echo "##vso[task.setvariable variable=imagesExist;isOutput=true]${imagesExist}"
                echo "##vso[task.setvariable variable=stagingVerified;isOutput=true]${stagingVerified}"
                echo "##vso[task.setvariable variable=isDocsCommit;isOutput=true]${isDocsCommit}"

  # ── Build — only when there's something new to build ────────────────────────
  - stage: Build
    displayName: Build and push images ($(Build.SourceBranchName))
    dependsOn: Prepare
    variables:
      shortSha: $[ stageDependencies.Prepare.Resolve.outputs['EmitVars.shortSha'] ]
    # `dev` never builds/deploys — it's Docker Compose only (see top-of-file
    # comment). Otherwise: build only if this commit's images don't all exist
    # yet, or the run explicitly asked for a rebuild.
    #
    # NOTE on dependencies.Prepare.outputs[...]: the key inside the brackets is
    # `<JobName>.<StepName>.<VariableName>` — three dot-separated parts — per
    # https://learn.microsoft.com/azure/devops/pipelines/process/expressions#dependencies.
    # Prepare's job is named `Resolve` and its output-emitting step is named
    # `EmitVars`, so the key is `Resolve.EmitVars.<name>`.
    condition: |
      and(
        ne(variables['Build.SourceBranch'], 'refs/heads/dev'),
        in(dependencies.Prepare.result, 'Succeeded', 'SucceededWithIssues'),
        or(
          ne(dependencies.Prepare.outputs['Resolve.EmitVars.imagesExist'], 'true'),
          eq(${{ parameters.forceRebuild }}, true)
        )
      )
    jobs:
      # Everything in one job: the hosted queue only has 1 free parallel job,
      # so a matrix per image would just serialize anyway with more overhead.
      - job: BuildPushImages
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            fetchDepth: 1

          # Login BEFORE creating the builder, deliberately: Docker@2's login
          # command overrides DOCKER_CONFIG to its own temp directory for the
          # rest of this job (a documented Docker@2 behavior —
          # microsoft/azure-pipelines-tasks#20188). `docker buildx` stores
          # both a builder's instance definition and the "current" pointer
          # under $DOCKER_CONFIG/buildx/ — creating the builder first, then
          # letting login switch DOCKER_CONFIG out from under it, silently
          # strands that builder in a config dir later steps never see again.
          # buildx then falls back to the default `docker`-driver builder,
          # which can't export cache at all ("Cache export is not supported
          # for the docker driver") — hit for real on the first live run of
          # this pipeline (build 344). Creating the builder after login keeps
          # both the instance and the "current" pointer in the one
          # DOCKER_CONFIG that's actually active for every step from here on.
          - task: Docker@2
            displayName: "Login to Docker Hub"
            inputs:
              containerRegistry: "$(DOCKER_SERVICE_CONNECTION)"
              command: "login"

          - task: Bash@3
            displayName: "Create buildx builder"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                docker buildx create --name redinfo --driver docker-container --use
                docker buildx inspect --bootstrap

          # The frontend's tab title / installed-app name used to be baked in
          # here via a "Determine frontend app title" step + `--build-arg
          # VITE_APP_TITLE`. Pass 1 moved that to container start instead (one
          # image, promoted staging → production, is stamped per-environment by
          # packages/frontend/docker-entrypoint-app-title.sh at boot) — nothing
          # to do here any more.

          - task: Bash@3
            displayName: "Build and push all images (buildx, registry cache)"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail

                SHORT_SHA="$(shortSha)"
                BRANCH="$(Build.SourceBranchName)"
                # HEAD's own commit date — fetchDepth:1 still carries this one
                # commit's full metadata, just no history behind it.
                COMMIT_DATE="$(git log -1 --format=%cI)"

                # image -> "dockerfile|target" (target blank = single-stage Dockerfile)
                declare -A IMAGES=(
                  [backend]="packages/backend/Dockerfile|prod"
                  [frontend]="packages/frontend/Dockerfile|prod"
                  [legacy-migration]="packages/legacy-migration/Dockerfile|job"
                  [inem-worker]="packages/inem-worker/Dockerfile|"
                )

                for img in "${!IMAGES[@]}"; do
                  IFS='|' read -r dockerfile target <<< "${IMAGES[$img]}"
                  targetArgs=()
                  if [ -n "${target}" ]; then
                    targetArgs=(--target "${target}")
                  fi

                  # Only the backend serves GET /health/version (the About
                  # dialog's source) — passing these to the other Dockerfiles,
                  # which don't declare the ARG, would just print buildx's
                  # "build-arg not consumed" warning for nothing.
                  buildArgs=()
                  if [ "${img}" = "backend" ]; then
                    buildArgs=(--build-arg "GIT_COMMIT_SHA=${SHORT_SHA}" --build-arg "GIT_COMMIT_DATE=${COMMIT_DATE}")
                  fi

                  echo "── Building jpsfs/redinfo-${img} (${dockerfile}${target:+, target ${target}}) ──"
                  # --builder explicit, not ambient "current" state: see the
                  # comment above "Create buildx builder" for why relying on
                  # implicit context here bit us on the first live run.
                  docker buildx build \
                    --builder redinfo \
                    -f "${dockerfile}" "$(Build.SourcesDirectory)" \
                    "${targetArgs[@]}" \
                    "${buildArgs[@]}" \
                    --cache-from "type=registry,ref=jpsfs/redinfo-${img}:buildcache" \
                    --cache-to "type=registry,ref=jpsfs/redinfo-${img}:buildcache,mode=max" \
                    --provenance=false --sbom=false \
                    -t "jpsfs/redinfo-${img}:sha-${SHORT_SHA}" \
                    -t "jpsfs/redinfo-${img}:${BRANCH}" \
                    --push
                done

  # ── DeployStaging ─────────────────────────────────────────────────────────
  - stage: DeployStaging
    displayName: Deploy to staging
    dependsOn: [Prepare, Build]
    # Build is legitimately SKIPPED when the commit's images already exist —
    # succeeded() alone would treat that skip as "not succeeded" and block every
    # promotion forever after the first build. Failed/Canceled is the only
    # outcome that should actually stop a deploy; Skipped and Succeeded both mean
    # "there is a good image to deploy".
    condition: |
      and(
        eq(variables['Build.SourceBranch'], 'refs/heads/env/staging'),
        in(dependencies.Prepare.result, 'Succeeded', 'SucceededWithIssues'),
        not(in(dependencies.Build.result, 'Failed', 'Canceled'))
      )
    variables:
      - group: redinfo-staging
      - name: shortSha
        value: $[ stageDependencies.Prepare.Resolve.outputs['EmitVars.shortSha'] ]
    jobs:
      - deployment: DeployToStaging
        displayName: Deploy Helm chart to staging
        pool:
          name: vm-redcross
        environment: redinfo-staging
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/deploy-env.yml
                  parameters:
                    envName: staging
                    imageTag: sha-$(shortSha)

  # ── MarkStagingVerified — the only proof a commit passed staging ────────────
  - stage: MarkStagingVerified
    displayName: Mark commit verified on staging
    # Prepare must be listed explicitly, not just DeployStaging: this stage's
    # `variables:` block below reads Prepare's outputs via stageDependencies,
    # and that only resolves reliably when Prepare is a DIRECT dependency —
    # relying on it being reachable transitively through DeployStaging (which
    # does depend on Prepare) resolved to an empty string in practice (hit
    # for real on build 350: shortSha came back blank, producing the image
    # tag "sha-" and a hard failure at `docker buildx imagetools create`).
    # Every other stage below that reads Prepare's outputs lists Prepare
    # explicitly in dependsOn for the same reason — this one was the one
    # exception.
    dependsOn: [Prepare, DeployStaging]
    condition: succeeded()
    variables:
      shortSha: $[ stageDependencies.Prepare.Resolve.outputs['EmitVars.shortSha'] ]
    jobs:
      - job: MarkVerified
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: Docker@2
            displayName: "Login to Docker Hub"
            inputs:
              containerRegistry: "$(DOCKER_SERVICE_CONNECTION)"
              command: "login"

          - task: Bash@3
            displayName: "Create staging-ok-<sha> marker"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                # A registry-side manifest copy (no layer pull/push, ~1s), run on
                # the hosted agent deliberately so nothing depends on buildx
                # existing on vm-redcross. This marker's existence is the ONLY
                # thing that proves "commit sha-$(shortSha) deployed to staging
                # and passed its post-deploy smoke check" — PromotionGate below
                # refuses production for any commit lacking it, short of
                # forceProduction.
                docker buildx imagetools create \
                  -t "jpsfs/redinfo-backend:staging-ok-$(shortSha)" \
                  "jpsfs/redinfo-backend:sha-$(shortSha)"
                echo "Marked sha-$(shortSha) as staging-verified."

  # ── PromotionGate ────────────────────────────────────────────────────────
  - stage: PromotionGate
    displayName: Promotion gate (staging → production)
    dependsOn: [Prepare, Build]
    condition: |
      and(
        eq(variables['Build.SourceBranch'], 'refs/heads/env/production'),
        in(dependencies.Prepare.result, 'Succeeded', 'SucceededWithIssues'),
        not(in(dependencies.Build.result, 'Failed', 'Canceled'))
      )
    variables:
      shortSha: $[ stageDependencies.Prepare.Resolve.outputs['EmitVars.shortSha'] ]
      stagingVerified: $[ stageDependencies.Prepare.Resolve.outputs['EmitVars.stagingVerified'] ]
    jobs:
      - job: Gate
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: none
          - task: Bash@3
            displayName: "Verify this commit passed staging (or forceProduction)"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                SHA="$(shortSha)"
                # Boolean pipeline parameters render as True/False (capitalized)
                # when substituted into a script body — normalize before
                # comparing.
                FORCE="${{ parameters.forceProduction }}"
                FORCE="${FORCE,,}"

                if [ "${FORCE}" = "true" ]; then
                  echo "##vso[task.logissue type=warning]forceProduction=true — deploying commit ${SHA} ($(Build.SourceVersion)) to production WITHOUT a verified staging deploy."
                  echo "##vso[task.logissue type=warning]This bypasses the promotion gate entirely. Make sure that was intentional."
                  exit 0
                fi

                if [ "$(stagingVerified)" != "true" ]; then
                  echo "##vso[task.logissue type=error]Refusing to deploy commit ${SHA} ($(Build.SourceVersion)) to production."
                  echo "##vso[task.logissue type=error]No staging-ok-${SHA} marker exists in the registry — this exact commit has never had a successful, smoke-tested staging deploy."
                  echo "##vso[task.logissue type=error]Fix: fast-forward this commit onto env/staging and push it there first; wait for DeployStaging + MarkStagingVerified to go green."
                  echo "##vso[task.logissue type=error]Escape hatch: re-run this pipeline manually with the 'forceProduction' parameter set to true."
                  exit 1
                fi

                echo "staging-ok-${SHA} marker found — commit verified on staging. Proceeding to production."

  # ── DeployProduction ─────────────────────────────────────────────────────
  - stage: DeployProduction
    displayName: Deploy to production (vm-redcross)
    dependsOn: [Prepare, Build, PromotionGate]
    condition: |
      and(
        eq(variables['Build.SourceBranch'], 'refs/heads/env/production'),
        in(dependencies.Prepare.result, 'Succeeded', 'SucceededWithIssues'),
        not(in(dependencies.Build.result, 'Failed', 'Canceled')),
        succeeded('PromotionGate')
      )
    variables:
      - group: redinfo-production
      - name: shortSha
        value: $[ stageDependencies.Prepare.Resolve.outputs['EmitVars.shortSha'] ]
    jobs:
      - deployment: DeployToProduction
        displayName: Deploy Helm chart to production
        pool:
          name: vm-redcross
        # Deliberately no ADO approval check on this Environment (Environments
        # > redinfo-production > Approvals and checks stays empty) — the human
        # control here is push access to env/production itself (GitHub branch
        # protection), not a click in ADO. PromotionGate above is the only
        # in-pipeline gate: production refuses any commit without a
        # staging-ok-<sha> marker, short of forceProduction.
        environment: redinfo-production
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/deploy-env.yml
                  parameters:
                    envName: production
                    imageTag: sha-$(shortSha)

  # ── DeployProductionContabo ───────────────────────────────────────────────
  #
  # The second production host, running in parallel with DeployProduction
  # above during the vm-redcross → Contabo migration. Same commit, same images,
  # same `redinfo-production` secrets, same promotion gate — a different
  # machine. At cutover, app.cvpcampo.org is repointed at this host and the
  # vm-redcross stage is deleted.
  #
  # Two things are deliberately NOT true of this host until that cutover:
  #   * Background jobs are off (see contaboBackgroundJobs below).
  #   * OAuth sign-in will not complete on it. GOOGLE_CALLBACK_URL and
  #     FRONTEND_URL both name app.cvpcampo.org, which still resolves to
  #     vm-redcross, so the provider redirects back there. That is expected;
  #     it fixes itself when DNS moves, and nothing here should paper over it.
  #
  # The host is provisioned separately by .ado/infrastructure.yml — this
  # pipeline only ever deploys onto it.
  - stage: DeployProductionContabo
    displayName: Deploy to production (Contabo host)
    dependsOn: [Prepare, Build, PromotionGate]
    # Same gate as DeployProduction, plus a switch. CONTABO_DEPLOY_ENABLED
    # lives in the `redinfo-contabo` variable group so the host can be brought
    # into (or dropped out of) the production rotation by editing one variable,
    # with no commit. It must be the string 'true' to count.
    #
    # Keep it 'false' until the VM exists AND its ADO agent is registered and
    # online in the `contabo-production` pool — a stage queued against an empty
    # pool sits there until it times out. It cannot affect the vm-redcross
    # deploy either way: that is a separate stage with no dependency on this.
    condition: |
      and(
        eq(variables['Build.SourceBranch'], 'refs/heads/env/production'),
        in(dependencies.Prepare.result, 'Succeeded', 'SucceededWithIssues'),
        not(in(dependencies.Build.result, 'Failed', 'Canceled')),
        succeeded('PromotionGate'),
        or(
          eq(variables['CONTABO_DEPLOY_ENABLED'], 'true'),
          eq('${{ parameters.deployToContabo }}', true)
        )
      )
    variables:
      - group: redinfo-production
      - group: redinfo-contabo
      - group: redinfo-tfstate
      - name: shortSha
        value: $[ stageDependencies.Prepare.Resolve.outputs['EmitVars.shortSha'] ]
      - name: TF_VERSION
        value: "1.16.3"
      - name: TF_DIR
        value: "$(Build.SourcesDirectory)/infra/terraform"
      - name: TF_IN_AUTOMATION
        value: "true"
      - name: TF_INPUT
        value: "false"
    jobs:
      - deployment: DeployToContaboProduction
        displayName: Deploy Helm chart to the Contabo production host
        # An ADO agent running on the Contabo box itself, exactly like
        # vm-redcross — which is what lets this reuse templates/deploy-env.yml
        # unchanged and keeps the Kubernetes API (16443) closed to the network.
        # The pool is populated by /opt/redinfo/register-ado-agent.sh on the
        # host; see infra/README.md.
        pool:
          name: contabo-production
        # Its own Environment, not the one DeployProduction uses: the two
        # stages deploy the same release to two different machines, and a
        # single Environment's deployment history would blur them together.
        environment: redinfo-production-contabo
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/deploy-env.yml
                  parameters:
                    envName: production
                    imageTag: sha-$(shortSha)
                    # Background jobs are OFF unless explicitly asked for, and
                    # that default is the important part of this stage. While
                    # vm-redcross is still live, this host is a SECOND instance
                    # holding the same production credentials: the
                    # legacy-migration cron would have two machines pulling
                    # from the one legacy MySQL every hour, and the INEM worker
                    # would have two headless browsers logging into the one
                    # shared INEM account and fighting over its session (see
                    # packages/inem-worker/README.md). Neither shows up as a
                    # deploy failure; both are noticed days later. Turn them on
                    # at cutover, once vm-redcross is off.
                    ${{ if eq(parameters.contaboBackgroundJobs, true) }}:
                      extraSetFlags: "--set legacyMigration.enabled=true --set legacyMigration.cron.enabled=true --set inemWorker.enabled=true"
                    ${{ else }}:
                      extraSetFlags: "--set legacyMigration.enabled=false --set legacyMigration.cron.enabled=false --set inemWorker.enabled=false"

      - job: PublicCheck
        displayName: "Check port 443 from outside the host"
        dependsOn: DeployToContaboProduction
        # Hosted agent on purpose: the deploy job above already proved the app
        # answers *on* the box. The open question for a brand-new machine is
        # whether 443 is reachable from the internet, and only an agent that is
        # not on that host can answer it.
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            fetchDepth: 1

          - task: Bash@3
            displayName: "Install Terraform $(TF_VERSION)"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                cd "$(Agent.TempDirectory)"
                curl -fsSLo terraform.zip \
                  "https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip"
                unzip -oq terraform.zip
                sudo install -m 0755 terraform /usr/local/bin/terraform

          - task: Bash@3
            displayName: "Resolve the host address from Terraform state"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                # Read-only: init + output, never a plan or an apply. The
                # address comes from state rather than a typed parameter so it
                # cannot drift from what actually exists.
                terraform -chdir="$(TF_DIR)" init \
                  -backend-config="bucket=${TFSTATE_BUCKET}" \
                  -backend-config="key=${TFSTATE_KEY}" \
                  -backend-config="region=${TFSTATE_REGION}" \
                  -backend-config="encrypt=true" \
                  -backend-config="use_lockfile=true"

                HOST_IP="$(terraform -chdir="$(TF_DIR)" output -raw ipv4)"
                if [ -z "${HOST_IP}" ] || [ "${HOST_IP}" = "null" ]; then
                  echo "##vso[task.logissue type=error]Terraform state has no ipv4 output — has infrastructure.yml ever been applied?" >&2
                  exit 1
                fi
                echo "##vso[task.setvariable variable=HOST_IP]${HOST_IP}"
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              TFSTATE_BUCKET: $(TFSTATE_BUCKET)
              TFSTATE_KEY: $(TFSTATE_KEY)
              TFSTATE_REGION: $(TFSTATE_REGION)

          - task: Bash@3
            displayName: "HTTPS on 443 from the public internet"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                INGRESS_HOST="$(PROD_INGRESS_HOST)"

                # -k because TLS is still the ingress controller's built-in
                # self-signed certificate (see infra/README.md); --resolve so
                # the Host header matches the Ingress rule without depending on
                # DNS having been moved to this machine yet.
                for path in / /api/health; do
                  code="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 20 \
                    --resolve "${INGRESS_HOST}:443:$(HOST_IP)" \
                    "https://${INGRESS_HOST}${path}" || true)"
                  if [ "${code}" = "200" ]; then
                    echo "OK (public https): ${path}"
                  else
                    echo "##vso[task.logissue type=error]Public HTTPS check failed for ${path} (HTTP ${code:-none}). Check the Contabo firewall and ufw on the host." >&2
                    exit 1
                  fi
                done

  # ── GenerateManuals — routed by commit message, never gates a deploy ───────
  - stage: GenerateManuals
    displayName: Generate operator manuals
    # Depends on Prepare ONLY, deliberately: this stage must never block or
    # gate a release, and no deploy stage depends on it either. A failure here
    # is visible in this pipeline's run but affects nothing else.
    #
    # `forceGenerateManuals` is the manual-run escape hatch for regenerating
    # the manuals without an empty `docs:` commit — see the Force parameters
    # section in .ado/README.md.
    dependsOn: Prepare
    condition: |
      or(
        eq(dependencies.Prepare.outputs['Resolve.EmitVars.isDocsCommit'], 'true'),
        eq(${{ parameters.forceGenerateManuals }}, true)
      )
    jobs:
      - job: GenerateManuals
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - template: templates/generate-manuals.yml
