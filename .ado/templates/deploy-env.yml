# Shared deploy steps for one environment, run on the self-hosted `vm-redcross`
# agent (same machine as the k8s cluster) — no SSH hop any more. The calling
# stage is responsible for pulling in that environment's `redinfo-<envName>`
# variable group (secrets referenced below come from there) and for the branch
# condition that gates the stage.
parameters:
  - name: envName # "staging" | "production" — must match values.<envName>.yaml
    type: string
  - name: imageTag
    type: string

steps:
  # Deployment jobs do not check out source by default — this must be explicit,
  # unlike a plain `job:`.
  - checkout: self
    fetchDepth: 1

  - task: Bash@3
    displayName: "Preflight: confirm helm/kubectl actually run as this agent"
    inputs:
      targetType: "inline"
      script: |
        set -euo pipefail

        resolve_bin() {
          local preferred="$1" fallback="$2"
          if command -v "${preferred}" >/dev/null 2>&1; then
            echo "${preferred}"
          elif command -v "${fallback}" >/dev/null 2>&1; then
            echo "${fallback}"
          else
            echo ""
          fi
        }

        HELM_BIN="$(resolve_bin microk8s.helm3 helm)"
        KUBECTL_BIN="$(resolve_bin microk8s.kubectl kubectl)"

        fail_with_group_hint() {
          echo "##vso[task.logissue type=error]$1" >&2
          echo "##vso[task.logissue type=error]The ADO agent's service account most likely needs to be added to the 'microk8s' group on this host (sudo usermod -aG microk8s <agent-user>, then restart the agent service so the new group membership takes effect)." >&2
          exit 1
        }

        if [ -z "${HELM_BIN}" ]; then
          fail_with_group_hint "Neither microk8s.helm3 nor helm is on PATH for this agent."
        fi
        if [ -z "${KUBECTL_BIN}" ]; then
          fail_with_group_hint "Neither microk8s.kubectl nor kubectl is on PATH for this agent."
        fi

        # A binary on PATH proves nothing by itself — actually run each one to
        # prove the agent's service account can talk to the cluster (this is
        # the single most likely first-run failure on a fresh self-hosted
        # agent: the binary resolves, but the account can't reach the
        # microk8s socket/group).
        if ! ${HELM_BIN} version >/dev/null 2>&1; then
          fail_with_group_hint "'${HELM_BIN} version' failed to run."
        fi
        if ! ${KUBECTL_BIN} version --client >/dev/null 2>&1; then
          fail_with_group_hint "'${KUBECTL_BIN} version --client' failed to run."
        fi

        echo "HELM_BIN=${HELM_BIN}"
        echo "KUBECTL_BIN=${KUBECTL_BIN}"
        echo "##vso[task.setvariable variable=HELM_BIN]${HELM_BIN}"
        echo "##vso[task.setvariable variable=KUBECTL_BIN]${KUBECTL_BIN}"

  - task: Bash@3
    displayName: "Render secrets values file (${{ parameters.envName }})"
    inputs:
      targetType: "inline"
      script: |
        set -euo pipefail
        # Secret variables from the `redinfo-${{ parameters.envName }}` group are not
        # expanded via $(VAR) macro syntax into free-form script text — they're only
        # available once explicitly mapped below as process env vars. Writing them to
        # a values file (rather than `--set` on the command line) also keeps them out
        # of `ps aux`/shell history on the deploy host.

        # Optional-per-environment vars (RESEND_API_KEY, NOTIFICATION_EMAIL_FROM,
        # VAPID_*): when a variable doesn't exist ANYWHERE in scope — root pipeline
        # variables included — Azure Pipelines does not expand its $(VAR) macro to
        # an empty string; it leaves the literal text "$(VAR)" in the env: mapping
        # below, which lands here as a non-empty value. Every app-side "is this
        # configured" check is a truthiness check (see WebPushChannelService,
        # EmailChannelService), so that literal text reads as configured and
        # crashes/misbehaves on first use. Blank out anything that still looks
        # like an unresolved macro before it ever reaches secrets.yaml.
        unmacro() {
          local val="$1"
          if [[ "${val}" =~ ^\$\([A-Za-z0-9_.]+\)$ ]]; then
            echo ""
          else
            echo "${val}"
          fi
        }
        RESEND_API_KEY="$(unmacro "${RESEND_API_KEY:-}")"
        NOTIFICATION_EMAIL_FROM="$(unmacro "${NOTIFICATION_EMAIL_FROM:-}")"
        VAPID_PUBLIC_KEY="$(unmacro "${VAPID_PUBLIC_KEY:-}")"
        VAPID_PRIVATE_KEY="$(unmacro "${VAPID_PRIVATE_KEY:-}")"
        VAPID_SUBJECT="$(unmacro "${VAPID_SUBJECT:-}")"
        INEM_USERNAME="$(unmacro "${INEM_USERNAME:-}")"
        INEM_PASSWORD="$(unmacro "${INEM_PASSWORD:-}")"
        INEM_WORKER_TOKEN="$(unmacro "${INEM_WORKER_TOKEN:-}")"

        cat > "$(Agent.TempDirectory)/secrets.yaml" <<EOF
        secrets:
          JWT_SECRET: "${JWT_SECRET}"
          IDENTITY_ENCRYPTION_KEYS: "${IDENTITY_ENCRYPTION_KEYS}"
          GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
          GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
          GOOGLE_CALLBACK_URL: "${GOOGLE_CALLBACK_URL:-}"
          MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID:-}"
          MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET:-}"
          MICROSOFT_TENANT_ID: "${MICROSOFT_TENANT_ID:-}"
          MICROSOFT_CALLBACK_URL: "${MICROSOFT_CALLBACK_URL:-}"
          GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
          LEGACY_PROD_MYSQL_HOST: "${LEGACY_PROD_MYSQL_HOST:-}"
          LEGACY_PROD_MYSQL_PORT: "${LEGACY_PROD_MYSQL_PORT:-}"
          LEGACY_PROD_MYSQL_USER: "${LEGACY_PROD_MYSQL_USER:-}"
          LEGACY_PROD_MYSQL_PASSWORD: "${LEGACY_PROD_MYSQL_PASSWORD:-}"
          LEGACY_PROD_MYSQL_DATABASE: "${LEGACY_PROD_MYSQL_DATABASE:-}"
          RESEND_API_KEY: "${RESEND_API_KEY:-}"
          NOTIFICATION_EMAIL_FROM: "${NOTIFICATION_EMAIL_FROM:-}"
          VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
          VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
          VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
          INEM_USERNAME: "${INEM_USERNAME:-}"
          INEM_PASSWORD: "${INEM_PASSWORD:-}"
          INEM_WORKER_TOKEN: "${INEM_WORKER_TOKEN:-}"
        postgresql:
          auth:
            password: "${POSTGRES_PASSWORD}"
            postgresPassword: "${POSTGRES_PASSWORD}"
        EOF
        chmod 600 "$(Agent.TempDirectory)/secrets.yaml"
    env:
      JWT_SECRET: $(JWT_SECRET)
      IDENTITY_ENCRYPTION_KEYS: $(IDENTITY_ENCRYPTION_KEYS)
      GOOGLE_CLIENT_ID: $(GOOGLE_CLIENT_ID)
      GOOGLE_CLIENT_SECRET: $(GOOGLE_CLIENT_SECRET)
      GOOGLE_CALLBACK_URL: $(GOOGLE_CALLBACK_URL)
      MICROSOFT_CLIENT_ID: $(MICROSOFT_CLIENT_ID)
      MICROSOFT_CLIENT_SECRET: $(MICROSOFT_CLIENT_SECRET)
      MICROSOFT_TENANT_ID: $(MICROSOFT_TENANT_ID)
      MICROSOFT_CALLBACK_URL: $(MICROSOFT_CALLBACK_URL)
      GOOGLE_MAPS_API_KEY: $(GOOGLE_MAPS_API_KEY)
      # #165 notifications — deliberately only ever populated in the
      # `redinfo-production` variable group (see the comment above `secrets: {}`
      # in values.staging.yaml). If `redinfo-staging` ever defines these, this
      # step will happily pick them up too — don't add them there.
      RESEND_API_KEY: $(RESEND_API_KEY)
      NOTIFICATION_EMAIL_FROM: $(NOTIFICATION_EMAIL_FROM)
      VAPID_PUBLIC_KEY: $(VAPID_PUBLIC_KEY)
      VAPID_PRIVATE_KEY: $(VAPID_PRIVATE_KEY)
      VAPID_SUBJECT: $(VAPID_SUBJECT)
      # #211 — same "production only" reasoning as RESEND_API_KEY/VAPID_* above;
      # never add these to redinfo-staging. See values.staging.yaml's comment
      # on `secrets` and packages/inem-worker/README.md for the credential.
      INEM_USERNAME: $(INEM_USERNAME)
      INEM_PASSWORD: $(INEM_PASSWORD)
      INEM_WORKER_TOKEN: $(INEM_WORKER_TOKEN)
      POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)
      # Legacy production's own connection details — read only by
      # job-legacy-migration.yaml's Job, while legacyMigration.enabled is true
      # for this environment. Add these to the redinfo-<envName> variable
      # group the same way as the vars above; unset is fine (rendered empty)
      # for any environment with legacyMigration.enabled: false.
      LEGACY_PROD_MYSQL_HOST: $(LEGACY_PROD_MYSQL_HOST)
      LEGACY_PROD_MYSQL_PORT: $(LEGACY_PROD_MYSQL_PORT)
      LEGACY_PROD_MYSQL_USER: $(LEGACY_PROD_MYSQL_USER)
      LEGACY_PROD_MYSQL_PASSWORD: $(LEGACY_PROD_MYSQL_PASSWORD)
      LEGACY_PROD_MYSQL_DATABASE: $(LEGACY_PROD_MYSQL_DATABASE)

  - task: Bash@3
    displayName: "Clear stale Helm release lock, if any (${{ parameters.envName }})"
    inputs:
      targetType: "inline"
      script: |
        set -euo pipefail
        ENV_NAME="${{ parameters.envName }}"

        # A previous run that died mid-operation (agent killed, host rebooted,
        # even --atomic's own rollback getting interrupted) leaves the release
        # secret's status stuck at pending-install/-upgrade/-rollback. Helm 3
        # has no built-in self-heal for that — every future `upgrade --install`
        # fails immediately with "another operation ... is in progress" even
        # though nothing is actually running. Safe to clear unconditionally:
        # this stage never runs two deploys of the same release concurrently,
        # so a secret in one of these states is always stale, not a real lock.
        STUCK_SECRETS=$($(KUBECTL_BIN) get secrets -n "${ENV_NAME}" \
          -l "owner=helm,name=redinfo,status in (pending-install,pending-upgrade,pending-rollback)" \
          -o name 2>/dev/null || true)
        if [ -n "${STUCK_SECRETS}" ]; then
          echo "Clearing stale Helm release lock(s) before upgrade:"
          echo "${STUCK_SECRETS}"
          echo "${STUCK_SECRETS}" | xargs -r $(KUBECTL_BIN) delete -n "${ENV_NAME}"
        fi

  - task: Bash@3
    displayName: "helm upgrade --install (${{ parameters.envName }})"
    inputs:
      targetType: "inline"
      script: |
        set -euo pipefail
        ENV_NAME="${{ parameters.envName }}"
        VALUES_FILE="$(Build.SourcesDirectory)/deploy/redinfo/values.${ENV_NAME}.yaml"
        SECRETS_FILE="$(Agent.TempDirectory)/secrets.yaml"

        if [ ! -f "${VALUES_FILE}" ]; then
          echo "##vso[task.logissue type=error]Missing ${VALUES_FILE}" >&2
          exit 2
        fi

        # Tag by the commit's short SHA (sha-<shortSha>) now, not the old
        # immutable-but-meaningless Build.BuildId — same "pin an exact,
        # traceable image" guarantee, but the tag now identifies the commit
        # that produced the image, which is what makes staging → production
        # promotion-by-fast-forward meaningful (see .ado/README.md).
        IMAGE_OVERRIDES="--set-string image.backend.repository=jpsfs/redinfo-backend,image.backend.tag=${{ parameters.imageTag }},image.backend.pullPolicy=IfNotPresent,image.frontend.repository=jpsfs/redinfo-frontend,image.frontend.tag=${{ parameters.imageTag }},image.frontend.pullPolicy=IfNotPresent,image.legacyMigration.repository=jpsfs/redinfo-legacy-migration,image.legacyMigration.tag=${{ parameters.imageTag }},image.legacyMigration.pullPolicy=IfNotPresent,image.inemWorker.repository=jpsfs/redinfo-inem-worker,image.inemWorker.tag=${{ parameters.imageTag }},image.inemWorker.pullPolicy=IfNotPresent"

        # --timeout covers post-install/post-upgrade hooks too (job-seed, and
        # — where legacyMigration.enabled — job-legacy-migration: a fresh
        # mysqldump from legacy production + reload + full loader run, in one
        # Job). 10m was comfortable for job-seed alone; bumped for the second
        # hook's sake. --atomic means a hook running merely slowly, not
        # actually failing, still rolls the whole release back at this
        # deadline — raise it further if legacy production's real dataset
        # ever makes that a false alarm.
        #
        # No --dependency-update: the postgresql subchart is vendored at
        # deploy/redinfo/charts/postgresql-18.5.6.tgz (see Chart.lock) — that
        # flag would only make a pointless network call to the deprecated
        # bitnami chart repo.
        $(HELM_BIN) upgrade --install redinfo "$(Build.SourcesDirectory)/deploy/redinfo" -n "${ENV_NAME}" --create-namespace \
          -f "${VALUES_FILE}" -f "${SECRETS_FILE}" \
          ${IMAGE_OVERRIDES} \
          --history-max 5 --atomic --timeout 20m --wait

  - task: Bash@3
    displayName: "Smoke check (${{ parameters.envName }})"
    inputs:
      targetType: "inline"
      script: |
        set -euo pipefail
        ENV_NAME="${{ parameters.envName }}"
        LOCAL_PORT=18080

        # Resolved dynamically rather than assumed, since the exact Service
        # name is a Helm-templated resource name, not a fixed string.
        SVC="$($(KUBECTL_BIN) -n "${ENV_NAME}" get svc -l app.kubernetes.io/component=frontend -o name | head -1)"
        if [ -z "${SVC}" ]; then
          echo "##vso[task.logissue type=error]No frontend Service found in namespace ${ENV_NAME} (label app.kubernetes.io/component=frontend) — cannot smoke-check." >&2
          exit 1
        fi

        # Going through the frontend Service (not the pod directly) exercises
        # the real nginx → backend proxy path end to end — `--wait`'s readiness
        # probes above only prove each pod is individually ready, not that
        # routing between them actually works.
        $(KUBECTL_BIN) -n "${ENV_NAME}" port-forward "${SVC}" "${LOCAL_PORT}:80" >/tmp/port-forward.log 2>&1 &
        PF_PID=$!
        trap 'kill ${PF_PID} >/dev/null 2>&1 || true' EXIT

        check() {
          local path="$1"
          local deadline=$((SECONDS + 60))
          while [ ${SECONDS} -lt ${deadline} ]; do
            if curl -fsS -o /dev/null -w '%{http_code}' "http://127.0.0.1:${LOCAL_PORT}${path}" 2>/dev/null | grep -q '^200$'; then
              echo "OK: ${path}"
              return 0
            fi
            sleep 3
          done
          echo "##vso[task.logissue type=error]Smoke check failed: ${path} never returned HTTP 200 within 60s." >&2
          cat /tmp/port-forward.log >&2 || true
          return 1
        }

        # Give port-forward a moment to actually establish before the first probe.
        sleep 3
        check "/"
        check "/api/health"

  - task: Bash@3
    displayName: "Clean up rendered secrets"
    condition: always()
    inputs:
      targetType: "inline"
      script: |
        rm -f "$(Agent.TempDirectory)/secrets.yaml" || true
