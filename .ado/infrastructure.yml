# Terraform for the Contabo host that will run production (infra/terraform).
#
# Deliberately a SEPARATE pipeline from .ado/deployment.yml, and deliberately
# NOT triggered by pushes. Application deploys happen many times a day and are
# safe to automate; this one buys, rebuilds or destroys a server. It runs only
# when a human starts it and says which action they mean.
#
# Why a pipeline at all, rather than someone's laptop: the Contabo API
# credentials live in the `redinfo-contabo` variable group and nowhere else —
# no developer needs a copy, and every apply leaves a log with a name attached
# to it.
#
# Variable groups this needs:
#   redinfo-contabo   CNTB_OAUTH2_CLIENT_ID, CNTB_OAUTH2_CLIENT_SECRET,
#                     CNTB_OAUTH2_USER, CNTB_OAUTH2_PASS  (all secret)
#                     TF_VAR_image_id, TF_VAR_ssh_public_key  (not secret)
#   redinfo-tfstate   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (secret),
#                     TFSTATE_BUCKET, TFSTATE_KEY, TFSTATE_REGION
#
# The state bucket itself is created once, out of band, by
# infra/scripts/bootstrap-state-bucket.sh — it cannot be managed by the state
# it stores.
trigger: none
pr: none

parameters:
  - name: action
    displayName: "What to do"
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

  - name: confirm
    displayName: "I understand apply/destroy changes real, billed infrastructure"
    type: boolean
    default: false

  - name: deployApp
    displayName: "Also deploy the application to the provisioned host"
    type: boolean
    default: false

  - name: imageTag
    displayName: "Image tag to deploy (sha-<shortSha>, or the moving 'production' tag)"
    type: string
    default: "production"

  - name: enableBackgroundJobs
    displayName: "Enable the legacy-migration cron and the INEM worker on the new host (see the stage's comment first)"
    type: boolean
    default: false

variables:
  - name: TF_VERSION
    value: "1.16.3"
  - name: TF_DIR
    value: "$(Build.SourcesDirectory)/infra/terraform"
  # Terraform is not a TTY here; without this every plan is full of control
  # characters in the log.
  - name: TF_IN_AUTOMATION
    value: "true"
  - name: TF_INPUT
    value: "false"

stages:
  - stage: Terraform
    displayName: "Terraform ${{ parameters.action }}"
    variables:
      - group: redinfo-contabo
      - group: redinfo-tfstate
    jobs:
      - job: Run
        displayName: "terraform ${{ parameters.action }}"
        # Hosted agent, unlike the deploy stages in .ado/deployment.yml: this
        # job talks to the Contabo and AWS APIs over the internet and has no
        # reason to touch any cluster, so it must NOT run on a self-hosted
        # agent that happens to be a production machine.
        pool:
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 60
        steps:
          - checkout: self
            fetchDepth: 1

          - task: Bash@3
            displayName: "Guard: apply/destroy require the confirm checkbox"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                ACTION="${{ parameters.action }}"
                CONFIRM="${{ parameters.confirm }}"

                if [ "${ACTION}" = "plan" ]; then
                  echo "plan is read-only; no confirmation needed."
                  exit 0
                fi

                # The checkbox is the whole point: a mis-click on the action
                # dropdown alone cannot buy or destroy a server.
                if [ "${CONFIRM}" != "True" ] && [ "${CONFIRM}" != "true" ]; then
                  echo "##vso[task.logissue type=error]'${ACTION}' requires the confirmation checkbox. Re-run the pipeline and tick it." >&2
                  exit 1
                fi
                echo "${ACTION} confirmed."

          - task: Bash@3
            displayName: "Install Terraform $(TF_VERSION)"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                cd "$(Agent.TempDirectory)"
                curl -fsSLo terraform.zip \
                  "https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip"
                unzip -oq terraform.zip
                sudo install -m 0755 terraform /usr/local/bin/terraform
                terraform version

          - task: Bash@3
            displayName: "terraform init"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                # Backend settings come in as -backend-config flags rather than
                # a committed file, so the bucket name is configuration, not
                # something published in the repo.
                terraform -chdir="$(TF_DIR)" init \
                  -backend-config="bucket=${TFSTATE_BUCKET}" \
                  -backend-config="key=${TFSTATE_KEY}" \
                  -backend-config="region=${TFSTATE_REGION}" \
                  -backend-config="encrypt=true" \
                  -backend-config="use_lockfile=true"
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              TFSTATE_BUCKET: $(TFSTATE_BUCKET)
              TFSTATE_KEY: $(TFSTATE_KEY)
              TFSTATE_REGION: $(TFSTATE_REGION)

          - task: Bash@3
            displayName: "terraform fmt -check && validate"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                terraform -chdir="$(TF_DIR)" fmt -check -recursive
                terraform -chdir="$(TF_DIR)" validate

          - task: Bash@3
            displayName: "terraform ${{ parameters.action }}"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                ACTION="${{ parameters.action }}"

                case "${ACTION}" in
                  plan)
                    # -detailed-exitcode would make "there are changes" a
                    # pipeline failure, which is wrong for a plan whose whole
                    # job is to show them. Read the log instead.
                    terraform -chdir="$(TF_DIR)" plan -out=tfplan
                    terraform -chdir="$(TF_DIR)" show -no-color tfplan > "$(Build.ArtifactStagingDirectory)/plan.txt"
                    ;;
                  apply)
                    # Plan and apply in one step, on purpose: an apply of a
                    # plan file saved by an earlier *run* can be stale, and a
                    # stale plan against infrastructure this small is more
                    # dangerous than re-planning.
                    terraform -chdir="$(TF_DIR)" apply -auto-approve
                    terraform -chdir="$(TF_DIR)" output -json > "$(Build.ArtifactStagingDirectory)/outputs.json"
                    ;;
                  destroy)
                    terraform -chdir="$(TF_DIR)" destroy -auto-approve
                    ;;
                esac
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              # The provider reads these four itself — see infra/terraform/providers.tf.
              CNTB_OAUTH2_CLIENT_ID: $(CNTB_OAUTH2_CLIENT_ID)
              CNTB_OAUTH2_CLIENT_SECRET: $(CNTB_OAUTH2_CLIENT_SECRET)
              CNTB_OAUTH2_USER: $(CNTB_OAUTH2_USER)
              CNTB_OAUTH2_PASS: $(CNTB_OAUTH2_PASS)
              TF_VAR_image_id: $(TF_VAR_image_id)
              TF_VAR_ssh_public_key: $(TF_VAR_ssh_public_key)

          - task: PublishBuildArtifacts@1
            displayName: "Publish plan/outputs"
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)"
              ArtifactName: terraform

  # ── Deploy the application onto the host Terraform just provisioned ────────
  #
  # Runs on the `contabo-production` agent pool — an ADO agent installed on
  # the Contabo host itself, exactly like `vm-redcross` today. That is what
  # lets this stage reuse templates/deploy-env.yml *unchanged*: the agent is
  # on the same machine as the cluster, so there is no SSH hop, no chart
  # copy, and no Kubernetes API exposed to the internet
  # (var.kube_api_allowed_cidrs stays empty).
  #
  # A pool of its own rather than a second agent in the `vm-redcross` pool:
  # a pool is the unit a stage targets, so separate pools are what let the old
  # and the new production host be deployed to independently during the
  # migration — and what stops a job meant for one landing on the other.
  #
  # The agent is staged by cloud-init but registered by hand, once:
  #   sudo /opt/redinfo/register-ado-agent.sh <PAT>
  # (a PAT in user_data would sit in Terraform state, and rotating it would
  # mean reinstalling the server — see infra/README.md).
  - stage: DeployNewProduction
    displayName: "Deploy application to the Contabo host"
    dependsOn: Terraform
    # Explicitly asked for, never after a destroy, and only if Terraform
    # succeeded. A plan-only run leaves the host untouched but is still a
    # perfectly valid thing to deploy after.
    condition: |
      and(
        succeeded(),
        eq('${{ parameters.deployApp }}', true),
        ne('${{ parameters.action }}', 'destroy')
      )
    variables:
      # The same group .ado/deployment.yml uses for production — this deploys
      # the real environment, not a lookalike.
      - group: redinfo-production
    jobs:
      - deployment: DeployToContaboProduction
        displayName: Deploy Helm chart to the Contabo production host
        pool:
          name: contabo-production
        environment: redinfo-production
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/deploy-env.yml
                  parameters:
                    envName: production
                    imageTag: ${{ parameters.imageTag }}
                    # Background jobs are OFF unless explicitly asked for, and
                    # that default is the important part of this stage. While
                    # vm-redcross is still live, this host is a SECOND instance
                    # holding the same production credentials: the
                    # legacy-migration cron would have two machines pulling
                    # from the same legacy MySQL hourly, and the INEM worker
                    # would have two headless browsers logging into the one
                    # shared INEM account and fighting over its session (see
                    # packages/inem-worker/README.md). Neither is a deploy-time
                    # error; both are noticed days later. Turn them on at
                    # cutover, once vm-redcross is off.
                    ${{ if eq(parameters.enableBackgroundJobs, true) }}:
                      extraSetFlags: "--set legacyMigration.enabled=true --set legacyMigration.cron.enabled=true --set inemWorker.enabled=true"
                    ${{ else }}:
                      extraSetFlags: "--set legacyMigration.enabled=false --set legacyMigration.cron.enabled=false --set inemWorker.enabled=false"

      - job: PublicCheck
        displayName: "Check port 443 from outside the host"
        dependsOn: DeployToContaboProduction
        # Hosted agent on purpose: the deploy job above already proved the app
        # answers *on* the box. The open question for this machine is whether
        # 443 is reachable from the internet, and only an agent that is not on
        # that host can answer it.
        pool:
          vmImage: "ubuntu-latest"
        variables:
          - group: redinfo-contabo
          - group: redinfo-tfstate
        steps:
          - checkout: self
            fetchDepth: 1

          - task: Bash@3
            displayName: "Install Terraform $(TF_VERSION)"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                cd "$(Agent.TempDirectory)"
                curl -fsSLo terraform.zip \
                  "https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip"
                unzip -oq terraform.zip
                sudo install -m 0755 terraform /usr/local/bin/terraform

          - task: Bash@3
            displayName: "Resolve the host address from Terraform state"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                # Read-only: init + output, never a plan or an apply. The
                # address comes from state rather than a typed parameter so it
                # cannot drift from what actually exists.
                terraform -chdir="$(TF_DIR)" init \
                  -backend-config="bucket=${TFSTATE_BUCKET}" \
                  -backend-config="key=${TFSTATE_KEY}" \
                  -backend-config="region=${TFSTATE_REGION}" \
                  -backend-config="encrypt=true" \
                  -backend-config="use_lockfile=true"

                HOST_IP="$(terraform -chdir="$(TF_DIR)" output -raw ipv4)"
                if [ -z "${HOST_IP}" ] || [ "${HOST_IP}" = "null" ]; then
                  echo "##vso[task.logissue type=error]Terraform state has no ipv4 output." >&2
                  exit 1
                fi
                echo "##vso[task.setvariable variable=HOST_IP]${HOST_IP}"
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              TFSTATE_BUCKET: $(TFSTATE_BUCKET)
              TFSTATE_KEY: $(TFSTATE_KEY)
              TFSTATE_REGION: $(TFSTATE_REGION)

          - task: Bash@3
            displayName: "HTTPS on 443 from the public internet"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                INGRESS_HOST="$(PROD_INGRESS_HOST)"

                # -k because TLS is still the ingress controller's built-in
                # self-signed certificate (see infra/README.md); --resolve so
                # the Host header matches the Ingress rule without depending on
                # DNS having been moved to this machine yet.
                for path in / /api/health; do
                  code="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 20 \
                    --resolve "${INGRESS_HOST}:443:$(HOST_IP)" \
                    "https://${INGRESS_HOST}${path}" || true)"
                  if [ "${code}" = "200" ]; then
                    echo "OK (public https): ${path}"
                  else
                    echo "##vso[task.logissue type=error]Public HTTPS check failed for ${path} (HTTP ${code:-none}). Check the Contabo firewall and ufw on the host." >&2
                    exit 1
                  fi
                done
