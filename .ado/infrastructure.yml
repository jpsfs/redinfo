# Terraform for the Contabo host that will run production (infra/terraform).
#
# This pipeline PROVISIONS the machine. It does not deploy the application —
# that is .ado/deployment.yml's DeployProductionContabo stage, which runs on
# an ADO agent on the host and is gated by the same promotion gate as every
# other production deploy.
#
# Why the two are separate pipelines rather than one stage in front of the
# other:
#   * Lifecycle. This runs a handful of times a year; deploys run daily. A
#     terraform plan in front of every deploy is noise that people learn to
#     scroll past, which is the opposite of what a plan is for.
#   * Blast radius. Folding it in would give every push to env/production a
#     job holding credentials that can destroy the server. Here, apply and
#     destroy need a human to pick the action AND tick a checkbox.
#   * Failure isolation. Contabo's API being down should not be able to stop
#     a code deploy to a machine that already exists.
#
# So: NOT triggered by pushes — it runs only when a human starts it and says
# which action they mean.
#
# Why a pipeline at all, rather than someone's laptop: the Contabo API
# credentials live in the `redinfo-contabo` variable group and nowhere else —
# no developer needs a copy, and every apply leaves a log with a name attached
# to it.
#
# Variable groups this needs:
#   redinfo-contabo   CNTB_OAUTH2_CLIENT_ID, CNTB_OAUTH2_CLIENT_SECRET,
#                     CNTB_OAUTH2_USER, CNTB_OAUTH2_PASS  (all secret)
#                     TF_VAR_image_id, TF_VAR_ssh_public_key  (not secret)
#   redinfo-tfstate   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (secret),
#                     TFSTATE_BUCKET, TFSTATE_KEY, TFSTATE_REGION
#
# The state bucket itself is created once, out of band, by
# infra/scripts/bootstrap-state-bucket.sh — it cannot be managed by the state
# it stores.
trigger: none
pr: none

parameters:
  - name: action
    displayName: "What to do"
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

  - name: confirm
    displayName: "I understand apply/destroy changes real, billed infrastructure"
    type: boolean
    default: false

variables:
  - name: TF_VERSION
    value: "1.16.3"
  - name: TF_DIR
    value: "$(Build.SourcesDirectory)/infra/terraform"
  # Terraform is not a TTY here; without this every plan is full of control
  # characters in the log.
  - name: TF_IN_AUTOMATION
    value: "true"
  - name: TF_INPUT
    value: "false"

stages:
  - stage: Terraform
    displayName: "Terraform ${{ parameters.action }}"
    variables:
      - group: redinfo-contabo
      - group: redinfo-tfstate
    jobs:
      - job: Run
        displayName: "terraform ${{ parameters.action }}"
        # Hosted agent, unlike the deploy stages in .ado/deployment.yml: this
        # job talks to the Contabo and AWS APIs over the internet and has no
        # reason to touch any cluster, so it must NOT run on a self-hosted
        # agent that happens to be a production machine.
        pool:
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 60
        steps:
          - checkout: self
            fetchDepth: 1

          - task: Bash@3
            displayName: "Guard: apply/destroy require the confirm checkbox"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                ACTION="${{ parameters.action }}"
                CONFIRM="${{ parameters.confirm }}"

                if [ "${ACTION}" = "plan" ]; then
                  echo "plan is read-only; no confirmation needed."
                  exit 0
                fi

                # The checkbox is the whole point: a mis-click on the action
                # dropdown alone cannot buy or destroy a server.
                if [ "${CONFIRM}" != "True" ] && [ "${CONFIRM}" != "true" ]; then
                  echo "##vso[task.logissue type=error]'${ACTION}' requires the confirmation checkbox. Re-run the pipeline and tick it." >&2
                  exit 1
                fi
                echo "${ACTION} confirmed."

          - task: Bash@3
            displayName: "Install Terraform $(TF_VERSION)"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                cd "$(Agent.TempDirectory)"
                curl -fsSLo terraform.zip \
                  "https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip"
                unzip -oq terraform.zip
                sudo install -m 0755 terraform /usr/local/bin/terraform
                terraform version

          - task: Bash@3
            displayName: "terraform init"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                # Backend settings come in as -backend-config flags rather than
                # a committed file, so the bucket name is configuration, not
                # something published in the repo.
                terraform -chdir="$(TF_DIR)" init \
                  -backend-config="bucket=${TFSTATE_BUCKET}" \
                  -backend-config="key=${TFSTATE_KEY}" \
                  -backend-config="region=${TFSTATE_REGION}" \
                  -backend-config="encrypt=true" \
                  -backend-config="use_lockfile=true"
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              TFSTATE_BUCKET: $(TFSTATE_BUCKET)
              TFSTATE_KEY: $(TFSTATE_KEY)
              TFSTATE_REGION: $(TFSTATE_REGION)

          - task: Bash@3
            displayName: "terraform fmt -check && validate"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                terraform -chdir="$(TF_DIR)" fmt -check -recursive
                terraform -chdir="$(TF_DIR)" validate

          - task: Bash@3
            displayName: "Resolve the Ubuntu image, and flag it if it has moved on"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail

                # var.image_id is pinned rather than looked up at plan time on
                # purpose: a dynamic lookup would turn "Contabo published a new
                # Ubuntu" into a plan that proposes REINSTALLING production
                # (image_id is one of the four attributes that rebuild the
                # machine — see infra/README.md). So the lookup lives here, as
                # information, and the pin stays a deliberate edit.
                LATEST="$(infra/scripts/contabo-images.sh --latest || true)"
                PINNED="${TF_VAR_image_id:-}"

                if [ -z "${PINNED}" ] || [ "${PINNED}" = "REPLACE_ME" ]; then
                  echo "##vso[task.logissue type=error]TF_VAR_image_id is not set in the 'redinfo-contabo' variable group." >&2
                  if [ -n "${LATEST}" ]; then
                    echo "##vso[task.logissue type=error]Set it to the newest Ubuntu LTS image, which is: ${LATEST}" >&2
                  else
                    echo "##vso[task.logissue type=error]The image lookup also failed - check the CNTB_OAUTH2_* values in that group." >&2
                  fi
                  exit 1
                fi

                echo "pinned image_id: ${PINNED}"
                if [ -n "${LATEST}" ] && [ "${LATEST}" != "${PINNED}" ]; then
                  echo "##vso[task.logissue type=warning]A newer Ubuntu LTS image exists (${LATEST}). This is informational - changing TF_VAR_image_id REINSTALLS the host, so only do it deliberately, on a machine you are willing to rebuild."
                fi
            env:
              CNTB_OAUTH2_CLIENT_ID: $(CNTB_OAUTH2_CLIENT_ID)
              CNTB_OAUTH2_CLIENT_SECRET: $(CNTB_OAUTH2_CLIENT_SECRET)
              CNTB_OAUTH2_USER: $(CNTB_OAUTH2_USER)
              CNTB_OAUTH2_PASS: $(CNTB_OAUTH2_PASS)
              TF_VAR_image_id: $(TF_VAR_image_id)

          - task: Bash@3
            displayName: "terraform ${{ parameters.action }}"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                ACTION="${{ parameters.action }}"

                case "${ACTION}" in
                  plan)
                    # -detailed-exitcode would make "there are changes" a
                    # pipeline failure, which is wrong for a plan whose whole
                    # job is to show them. Read the log instead.
                    terraform -chdir="$(TF_DIR)" plan -out=tfplan
                    terraform -chdir="$(TF_DIR)" show -no-color tfplan > "$(Build.ArtifactStagingDirectory)/plan.txt"
                    ;;
                  apply)
                    # Plan and apply in one step, on purpose: an apply of a
                    # plan file saved by an earlier *run* can be stale, and a
                    # stale plan against infrastructure this small is more
                    # dangerous than re-planning.
                    terraform -chdir="$(TF_DIR)" apply -auto-approve
                    terraform -chdir="$(TF_DIR)" output -json > "$(Build.ArtifactStagingDirectory)/outputs.json"
                    ;;
                  destroy)
                    terraform -chdir="$(TF_DIR)" destroy -auto-approve
                    ;;
                esac
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              # The provider reads these four itself — see infra/terraform/providers.tf.
              CNTB_OAUTH2_CLIENT_ID: $(CNTB_OAUTH2_CLIENT_ID)
              CNTB_OAUTH2_CLIENT_SECRET: $(CNTB_OAUTH2_CLIENT_SECRET)
              CNTB_OAUTH2_USER: $(CNTB_OAUTH2_USER)
              CNTB_OAUTH2_PASS: $(CNTB_OAUTH2_PASS)
              TF_VAR_image_id: $(TF_VAR_image_id)
              TF_VAR_ssh_public_key: $(TF_VAR_ssh_public_key)

          - task: Bash@3
            displayName: "Host facts (address, SSH, what to do next)"
            # succeededOrFailed so a partial apply still tells you what exists.
            condition: and(succeededOrFailed(), ne('${{ parameters.action }}', 'destroy'))
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                HOST_IP="$(terraform -chdir="$(TF_DIR)" output -raw ipv4 2>/dev/null || true)"
                if [ -z "${HOST_IP}" ]; then
                  echo "No ipv4 in state yet (a plan-only run, or nothing applied)."
                  exit 0
                fi

                echo "=================================================================="
                echo " Contabo production host: ${HOST_IP}"
                echo "=================================================================="
                echo
                echo " ssh -i <the key from 1Password> admin@${HOST_IP}"
                echo
                echo " Before this host can serve production, three things need doing"
                echo " by hand - none of them belong in Terraform:"
                echo
                echo " 1. Whitelist ${HOST_IP} on the Hostinger legacy MySQL."
                echo "    The legacy-migration job connects out from this address, and"
                echo "    Hostinger filters by source IP. Until it is whitelisted the"
                echo "    job fails on connect, so do this before turning background"
                echo "    jobs on at cutover."
                echo " 2. Register the ADO agent (once):"
                echo "      sudo /opt/redinfo/register-ado-agent.sh <PAT>"
                echo "    until it is online in the 'contabo-production' pool, the"
                echo "    deploy stage has nowhere to run."
                echo " 3. Flip CONTABO_DEPLOY_ENABLED to 'true' in the"
                echo "    'redinfo-contabo' variable group to bring this host into"
                echo "    the production deploy rotation (.ado/deployment.yml)."
                echo
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

          - task: PublishBuildArtifacts@1
            displayName: "Publish plan/outputs"
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)"
              ArtifactName: terraform
