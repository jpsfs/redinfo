# One-time, cluster-scoped bootstrap — not part of the `redinfo` Helm release (a
# ClusterIssuer is shared infrastructure, not something that should be reinstalled/
# templated per-environment by `helm upgrade --install redinfo ...`).
#
# Apply once per cluster, after enabling cert-manager:
#
#   microk8s enable cert-manager
#   microk8s kubectl apply -f deploy/cluster-bootstrap/cluster-issuer.yaml
#   microk8s kubectl get clusterissuer letsencrypt-prod -o wide   # READY: True once ACME registration succeeds
#
# Uses the HTTP-01 challenge over the `public` IngressClass — the same one
# staging/production's `values.<env>.yaml` already set as `ingress.className`
# (this is MicroK8s' `ingress` addon's default class name), so no extra DNS
# records or DNS-provider credentials are needed: cert-manager briefly adds
# its own solver path to that host's existing Ingress, and Let's Encrypt's
# validator hits it over the same HTTP listener already serving the app.
#
# Once this ClusterIssuer is Ready, flip staging/production over to it — see
# the `ingress.annotations`/`ingress.tls` comments in `values.staging.yaml` /
# `values.production.yaml` for the remaining per-environment steps (those
# *are* templated per-release, since the hostname/secretName differ).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Let's Encrypt emails this address about certs nearing expiry/renewal
    # failures — not used for anything else. Swap for a real address before
    # applying; ACME registration doesn't strictly require it to be live, but
    # an unreachable one defeats the point of it existing.
    email: redinfo-admin@jpsfs.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: public
