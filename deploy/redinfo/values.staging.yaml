namespace: staging

# Single replica: the uploads PVC is ReadWriteOnce and the backend migrates on boot,
# so a second generation can't safely run alongside the first anyway.
replicaCount: 1

image:
  backend:
    repository: jpsfs/redinfo-backend
    tag: "staging"
    pullPolicy: IfNotPresent
  frontend:
    repository: jpsfs/redinfo-frontend
    tag: "staging"
    pullPolicy: IfNotPresent
  legacyMigration:
    repository: jpsfs/redinfo-legacy-migration
    tag: "staging"
    pullPolicy: IfNotPresent

service:
  backend:
    type: ClusterIP
    port: 3000
  frontend:
    type: ClusterIP
    port: 80

ingress:
  enabled: true
  className: public
  # cert-manager.io/cluster-issuer wires this Ingress up to the ClusterIssuer applied
  # once per cluster by deploy/cluster-bootstrap/cluster-issuer.yaml — see that file
  # for the one-time `microk8s enable cert-manager` + `kubectl apply` bootstrap. Safe
  # to leave here even before that bootstrap has run: cert-manager simply doesn't
  # exist yet to act on the annotation, and the `tls` secret below stays unissued —
  # HTTP keeps working exactly as it does today (ingress-nginx falls back to its own
  # default self-signed cert on 443 for an unmatched/unissued secret, same as an
  # Ingress with no `tls` block at all).
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: staging-redcross.jpsfs.com
      paths:
        - path: /
          service: frontend
          servicePort: 80
  # Once the ClusterIssuer bootstrap has run and this cert shows READY (`kubectl get
  # certificate -n staging` / `describe` to watch the HTTP-01 challenge resolve — can
  # take a couple of minutes on the first issuance), flip FRONTEND_URL below and the
  # redinfo-staging ADO variable group's GOOGLE_CALLBACK_URL/MICROSOFT_CALLBACK_URL to
  # `https://staging-redcross.jpsfs.com/...`, and update the matching redirect URIs in
  # the Google/Microsoft OAuth app registrations to match — Google and Microsoft both
  # reject a non-localhost `http://` redirect_uri, which is why OAuth login (Google/
  # Microsoft) does not work on staging until this is done; the seeded local admin
  # account (admin@redcross.local) works regardless.
  tls:
    - secretName: redinfo-staging-tls
      hosts:
        - staging-redcross.jpsfs.com

resources:
  backend:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

env:
  backend:
    NODE_ENV: "production"
    PORT: "3000"
    ATTACHMENTS_DIR: "/app/uploads"
    FRONTEND_URL: "http://staging-redcross.jpsfs.com"
  frontend: {}

# Populated by the pipeline from the `redinfo-staging` ADO variable group via
# --set-string; left empty here so nothing sensitive is ever committed. Now
# includes LEGACY_PROD_MYSQL_HOST/PORT/USER/PASSWORD/DATABASE — see
# values.yaml's own comment on `secrets` and `legacyMigration` below.
#
# Deliberately never add RESEND_API_KEY / VAPID_* to the `redinfo-staging`
# variable group: those are only rendered from `redinfo-production` (see
# .ado/templates/deploy-env.yml). Real people's emails live in staging data,
# and EmailChannelService fails soft with no key configured — a notice still
# saves and shows in-app, it just isn't emailed until this environment gets
# its own real (non-production) transport. A shared internal Mailpit-style
# catch-all is planned for staging email preview; SMTP_HOST/SMTP_PORT will be
# added to `env.backend` above once that's ready — see
# packages/backend/src/notifications/channels/email-channel.service.ts for
# how the transport is chosen.
secrets: {}

uploads:
  enabled: true
  size: 10Gi
  mountPath: /app/uploads

seed:
  enabled: true

# Staging is the rehearsal environment for this bridge period: kept in sync
# with legacy production on every deploy for as long as both systems are
# live. See values.yaml's own comment and migration/README.md.
legacyMigration:
  enabled: true

# Enable a bundled Postgres instance for staging, with real persistence.
postgresql:
  enabled: true
  auth:
    username: redinfo
    database: redinfo_staging
    # password/postgresPassword are injected by the pipeline via --set-string;
    # this placeholder is only ever used if someone runs a manual `helm template`.
    password: "changeme"
    postgresPassword: "changeme"
  primary:
    persistence:
      enabled: true
      size: 10Gi
