namespace: staging

# Single replica: the uploads PVC is ReadWriteOnce and the backend migrates on boot,
# so a second generation can't safely run alongside the first anyway.
replicaCount: 1

image:
  backend:
    repository: jpsfs/redinfo-backend
    tag: "staging"
    pullPolicy: IfNotPresent
  frontend:
    repository: jpsfs/redinfo-frontend
    tag: "staging"
    pullPolicy: IfNotPresent
  legacyMigration:
    repository: jpsfs/redinfo-legacy-migration
    tag: "staging"
    pullPolicy: IfNotPresent

service:
  backend:
    type: ClusterIP
    port: 3000
  frontend:
    type: ClusterIP
    port: 80

ingress:
  enabled: true
  className: public
  hosts:
    - host: staging-redcross.jpsfs.com
      paths:
        - path: /
          service: frontend
          servicePort: 80
  # HTTP only for now — cert-manager is not enabled on this cluster yet. This means
  # OAuth login (Google/Microsoft) will not work on staging until TLS is added; use
  # the seeded local admin account (admin@redcross.local) in the meantime.
  tls: []

resources:
  backend:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

env:
  backend:
    NODE_ENV: "production"
    PORT: "3000"
    ATTACHMENTS_DIR: "/app/uploads"
    FRONTEND_URL: "http://staging-redcross.jpsfs.com"
  frontend: {}

# Populated by the pipeline from the `redinfo-staging` ADO variable group via
# --set-string; left empty here so nothing sensitive is ever committed. Now
# includes LEGACY_PROD_MYSQL_HOST/PORT/USER/PASSWORD/DATABASE — see
# values.yaml's own comment on `secrets` and `legacyMigration` below.
secrets: {}

uploads:
  enabled: true
  size: 10Gi
  mountPath: /app/uploads

seed:
  enabled: true

# Staging is the rehearsal environment for this bridge period: kept in sync
# with legacy production on every deploy for as long as both systems are
# live. See values.yaml's own comment and migration/README.md.
legacyMigration:
  enabled: true

# Enable a bundled Postgres instance for staging, with real persistence.
postgresql:
  enabled: true
  auth:
    username: redinfo
    database: redinfo_staging
    # password/postgresPassword are injected by the pipeline via --set-string;
    # this placeholder is only ever used if someone runs a manual `helm template`.
    password: "changeme"
    postgresPassword: "changeme"
  primary:
    persistence:
      enabled: true
      size: 10Gi
