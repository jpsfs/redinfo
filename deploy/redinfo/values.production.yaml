namespace: production

replicaCount: 1

image:
  backend:
    repository: jpsfs/redinfo-backend
    tag: "production"
    pullPolicy: IfNotPresent
  frontend:
    repository: jpsfs/redinfo-frontend
    tag: "production"
    pullPolicy: IfNotPresent
  legacyMigration:
    repository: jpsfs/redinfo-legacy-migration
    tag: "production"
    pullPolicy: IfNotPresent

service:
  backend:
    type: ClusterIP
    port: 3000
  frontend:
    type: ClusterIP
    port: 80

ingress:
  enabled: true
  className: public
  hosts:
    - host: app.cvpcampo.org
      paths:
        - path: /
          service: frontend
          servicePort: 80
  # HTTP-only at the origin, same as staging — Cloudflare is the proxy in front of
  # app.cvpcampo.org and terminates TLS for the browser; a plain-http origin behind
  # it is the working setup (see values.staging.yaml's own comment). FRONTEND_URL
  # below must stay https regardless, since it's used verbatim to build the
  # post-OAuth redirect Location.
  tls: []

resources:
  backend:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

env:
  backend:
    NODE_ENV: "production"
    PORT: "3000"
    ATTACHMENTS_DIR: "/app/uploads"
    FRONTEND_URL: "https://app.cvpcampo.org"
  frontend: {}

# Populated by the pipeline from a `redinfo-production` ADO variable group via
# --set-string; left empty here so nothing sensitive is ever committed. Now
# includes LEGACY_PROD_MYSQL_HOST/PORT/USER/PASSWORD/DATABASE — see
# values.yaml's own comment on `secrets` and `legacyMigration` below.
#
# This is the only environment where RESEND_API_KEY / VAPID_* should be set
# (see .ado/templates/deploy-env.yml and the matching comment in
# values.staging.yaml) — real notice emails and push notifications go out
# from here only.
secrets: {}

uploads:
  enabled: true
  size: 20Gi
  mountPath: /app/uploads

# Same seed job as staging (admin user + PT geography/hospitals reference data —
# see templates/job-seed.yaml, packages/backend/prisma/seed.ts). Idempotent and
# also a hard prerequisite for legacyMigration above (its preflight requires
# geography + hospitals to exist). Creates the same fixed default admin
# (admin@redcross.local / Admin1234!) as every other environment — rotate or
# disable that account by hand right after the first production deploy.
seed:
  enabled: true

# Kept in sync with legacy production both at deploy time (job-legacy-migration.yaml,
# so a fresh deploy has current data immediately) and hourly in between deploys
# (cron.schedule, templates/cronjob-legacy-migration.yaml) — the only environment
# that runs the recurring cron; staging stays deploy-time only (see
# values.staging.yaml, values.yaml, migration/README.md). This only takes effect
# once seed.enabled above has actually seeded geography + hospitals — the
# loader's preflight hard-requires that.
legacyMigration:
  enabled: true
  cron:
    enabled: true
    schedule: "0 * * * *"

postgresql:
  enabled: true
  auth:
    username: redinfo
    database: redinfo_production
    password: "changeme"
    postgresPassword: "changeme"
  primary:
    persistence:
      enabled: true
      size: 20Gi
