namespace: production

replicaCount: 1

image:
  backend:
    repository: jpsfs/redinfo-backend
    tag: "production"
    pullPolicy: IfNotPresent
  frontend:
    repository: jpsfs/redinfo-frontend
    tag: "production"
    pullPolicy: IfNotPresent
  legacyMigration:
    repository: jpsfs/redinfo-legacy-migration
    tag: "production"
    pullPolicy: IfNotPresent

service:
  backend:
    type: ClusterIP
    port: 3000
  frontend:
    type: ClusterIP
    port: 80

ingress:
  enabled: true
  className: public
  # See the matching comment in values.staging.yaml: wires this Ingress to the
  # ClusterIssuer from deploy/cluster-bootstrap/cluster-issuer.yaml (one-time,
  # per-cluster — apply that before this takes effect). FRONTEND_URL below is
  # already https, so once the cert shows READY nothing else needs to change here —
  # GOOGLE_CALLBACK_URL/MICROSOFT_CALLBACK_URL in the redinfo-production ADO
  # variable group should already be the matching https callback URLs; if not,
  # update those and the OAuth app registrations' redirect URIs to match.
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: app.cvpcampo.org
      paths:
        - path: /
          service: frontend
          servicePort: 80
  tls:
    - secretName: redinfo-production-tls
      hosts:
        - app.cvpcampo.org

resources:
  backend:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

env:
  backend:
    NODE_ENV: "production"
    PORT: "3000"
    ATTACHMENTS_DIR: "/app/uploads"
    FRONTEND_URL: "https://app.cvpcampo.org"
  frontend: {}

# Populated by the pipeline from a `redinfo-production` ADO variable group via
# --set-string; left empty here so nothing sensitive is ever committed. Now
# includes LEGACY_PROD_MYSQL_HOST/PORT/USER/PASSWORD/DATABASE — see
# values.yaml's own comment on `secrets` and `legacyMigration` below.
#
# This is the only environment where RESEND_API_KEY / VAPID_* should be set
# (see .ado/templates/deploy-env.yml and the matching comment in
# values.staging.yaml) — real notice emails and push notifications go out
# from here only.
secrets: {}

uploads:
  enabled: true
  size: 20Gi
  mountPath: /app/uploads

# TODO: decide whether production seeds an initial admin the same way staging does,
# or that account is created out-of-band before go-live.
seed:
  enabled: false

# Kept in sync with legacy production on every deploy for as long as both
# systems are live during this bridge period — same as staging (see
# values.staging.yaml, values.yaml, migration/README.md). This only takes
# effect once job-seed above (or an out-of-band equivalent) has actually
# seeded geography + hospitals — the loader's preflight hard-requires that.
legacyMigration:
  enabled: true

postgresql:
  enabled: true
  auth:
    username: redinfo
    database: redinfo_production
    password: "changeme"
    postgresPassword: "changeme"
  primary:
    persistence:
      enabled: true
      size: 20Gi
