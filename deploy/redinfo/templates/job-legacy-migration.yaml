{{- if .Values.legacyMigration.enabled -}}
{{- /*
  Runs on every install/upgrade, for as long as legacy production is still the
  system of record: fetches a fresh mysqldump straight from legacy production
  and migrates it into this environment's Postgres (see
  packages/legacy-migration/job-entrypoint.sh and migration/README.md). Every
  re-run is "legacy always wins" — an app-side edit to an already-imported row
  does not survive the next deploy, by design (upsert-engine.ts).

  Where legacyMigration.cron.enabled is also true (production), this hook
  still runs at deploy time so a fresh deploy has current data immediately —
  see the sibling templates/cronjob-legacy-migration.yaml for the recurring
  hourly-by-default run in between deploys.

  Ordered after job-seed (hook-weight "1" vs. "0"): the loader's own preflight
  hard-requires seeded geography + hospitals (prisma/seed-geography.ts) before
  it will touch anything, and job-seed is what seeds those.

  Built from packages/legacy-migration/Dockerfile's `job` target, not the
  `base` one docker-compose.migration.yml uses locally — it bundles its own
  throwaway MariaDB so this Job needs nothing else standing beside it.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "redinfo.fullname" . }}-legacy-migration-{{ .Release.Revision }}
  labels:
    app.kubernetes.io/name: {{ include "redinfo.name" . }}
    app.kubernetes.io/component: legacy-migration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # A fresh dump is expensive to refetch and legacy production has finite
  # patience for it — don't blindly retry a run that failed partway through.
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.legacyMigration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "redinfo.name" . }}
        app.kubernetes.io/component: legacy-migration
    spec:
      restartPolicy: Never
      containers:
        - name: legacy-migration
          image: "{{ .Values.image.legacyMigration.repository }}:{{ .Values.image.legacyMigration.tag }}"
          imagePullPolicy: {{ .Values.image.legacyMigration.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "redinfo.fullname" . }}-app-secrets
          env:
            - name: LEGACY_TIMEZONE
              value: {{ .Values.legacyMigration.timezone | quote }}
            - name: LEGACY_IMPORT_ACTOR_EMAIL
              value: {{ .Values.legacyMigration.importActorEmail | quote }}
{{- end -}}
