apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redinfo.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "redinfo.name" . }}
    app.kubernetes.io/component: backend
spec:
  # Recreate, not RollingUpdate: the uploads PVC is ReadWriteOnce and the entrypoint
  # runs `prisma migrate deploy` on boot, so two backend generations must never run
  # against the volume/schema at once.
  strategy:
    type: Recreate
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "redinfo.name" . }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "redinfo.name" . }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret-app.yaml") . | sha256sum }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: {{ include "redinfo.fullname" . }}-app-secrets
          env:
            {{- if kindIs "map" .Values.env.backend }}
            {{- range $name, $value := .Values.env.backend }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- else if kindIs "slice" .Values.env.backend }}
            {{- toYaml .Values.env.backend | nindent 12 }}
            {{- end }}
          {{- if .Values.uploads.enabled }}
          volumeMounts:
            - name: uploads
              mountPath: {{ .Values.uploads.mountPath }}
          {{- end }}
          {{- if .Values.probes.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: {{ .Values.probes.backend.initialDelaySeconds }}
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: {{ .Values.probes.backend.initialDelaySeconds }}
            periodSeconds: 20
            failureThreshold: 6
          {{- end }}
          resources:
{{ toYaml .Values.resources.backend | indent 12 }}
      {{- if .Values.uploads.enabled }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "redinfo.fullname" . }}-uploads
      {{- end }}
