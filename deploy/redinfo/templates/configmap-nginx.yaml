{{- /*
  Mirrors nginx/nginx.conf, with the upstream templated to this release's backend
  service instead of the compose service name "backend" — the frontend image bakes
  in the compose version, which is why it crash-loops ("host not found in upstream")
  once deployed outside compose.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redinfo.fullname" . }}-frontend-nginx
  labels:
    app.kubernetes.io/name: {{ include "redinfo.name" . }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
        gzip_min_length 1000;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://{{ include "redinfo.fullname" . }}-backend:{{ .Values.service.backend.port }}/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }

        # SPA route that receives the OAuth redirect — must be declared before
        # the /auth/ proxy below. nginx always prefers an exact match over a
        # prefix match, so this wins regardless of block order, but keep it
        # here for readability.
        location = /auth/callback {
            try_files $uri /index.html;
        }

        location /auth/ {
            proxy_pass http://{{ include "redinfo.fullname" . }}-backend:{{ .Values.service.backend.port }}/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
