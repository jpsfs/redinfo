{{- /*
  App secrets, keyed to match .env.example so compose and k8s share one vocabulary.
  Empty values are omitted rather than rendered as empty strings, so an unset OAuth
  provider simply isn't configured instead of overriding a container-image default.
*/ -}}
{{- $secrets := .Values.secrets | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redinfo.fullname" . }}-app-secrets
  labels:
    app.kubernetes.io/name: {{ include "redinfo.name" . }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "redinfo.databaseUrl" . | quote }}
  {{- /*
    LEGACY_PROD_MYSQL_* — read only by job-legacy-migration.yaml (see
    packages/legacy-migration/job-entrypoint.sh), never by the backend. Named
    distinctly from LEGACY_MYSQL_* on purpose: that name is what the loader
    itself reads, and inside that Job it's the *throwaway* local copy the
    entrypoint script creates, not legacy production — the two must never be
    the same value or a live connection replaces the point-in-time dump.
  */ -}}
  {{- range $key := list "JWT_SECRET" "IDENTITY_ENCRYPTION_KEYS" "GOOGLE_CLIENT_ID" "GOOGLE_CLIENT_SECRET" "GOOGLE_CALLBACK_URL" "MICROSOFT_CLIENT_ID" "MICROSOFT_CLIENT_SECRET" "MICROSOFT_TENANT_ID" "MICROSOFT_CALLBACK_URL" "GOOGLE_MAPS_API_KEY" "LEGACY_PROD_MYSQL_HOST" "LEGACY_PROD_MYSQL_PORT" "LEGACY_PROD_MYSQL_USER" "LEGACY_PROD_MYSQL_PASSWORD" "LEGACY_PROD_MYSQL_DATABASE" }}
  {{- $value := index $secrets $key }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
