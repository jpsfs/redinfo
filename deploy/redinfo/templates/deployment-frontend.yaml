apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redinfo.fullname" . }}-frontend
  labels:
    app.kubernetes.io/name: {{ include "redinfo.name" . }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "redinfo.name" . }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "redinfo.name" . }}
        app.kubernetes.io/component: frontend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports:
            - containerPort: 80
          {{- if or (and (kindIs "map" .Values.env.frontend) (gt (len .Values.env.frontend) 0)) (and (kindIs "slice" .Values.env.frontend) (gt (len .Values.env.frontend) 0)) }}
          env:
            {{- if kindIs "map" .Values.env.frontend }}
            {{- range $name, $value := .Values.env.frontend }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- else if kindIs "slice" .Values.env.frontend }}
            {{- toYaml .Values.env.frontend | nindent 12 }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          {{- if .Values.probes.enabled }}
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          {{- end }}
          resources:
{{ toYaml .Values.resources.frontend | indent 12 }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "redinfo.fullname" . }}-frontend-nginx
