# Development overrides — applied automatically by Docker Compose
# Adds source volume mounts for hot-reload on both services

name: redinfo

services:
  postgres:
    ports:
      - "5432:5432"  # expose DB port locally for tools like DBeaver / Prisma Studio

  backend:
    volumes:
      - ./packages/backend/src:/app/packages/backend/src
      - ./packages/backend/prisma:/app/packages/backend/prisma
      - ./packages/shared/src:/app/packages/shared/src
      # The backend resolves @redinfo/shared to dist/, not src/, so without this
      # mount a host-side `pnpm --filter @redinfo/shared build` never reaches the
      # running API — it silently keeps serving the dist baked into the image.
      - ./packages/shared/dist:/app/packages/shared/dist
      # Named volume to avoid overwriting container node_modules
      - backend_node_modules:/app/node_modules
      - backend_pkg_node_modules:/app/packages/backend/node_modules
    # Build shared first, so a fresh clone (empty dist/) still starts.
    #
    # `prisma generate` has to be repeated here: this `command` replaces the
    # Dockerfile's CMD, which is where it otherwise runs. Without it the
    # container keeps the client generated at image-build time, so the first
    # schema change after a build fails to compile against a stale client
    # (`Property 'x' does not exist on type 'PrismaService'`) and the API never
    # starts. The schema is bind-mounted above, so generating on every boot is
    # what keeps the client and the schema in step.
    command: >
      sh -c "[ -f /app/packages/shared/dist/index.js ] || pnpm --filter @redinfo/shared build;
             pnpm --filter backend prisma:generate;
             pnpm --filter backend dev"

  frontend:
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/frontend/index.html:/app/packages/frontend/index.html
      - ./packages/frontend/vite.config.ts:/app/packages/frontend/vite.config.ts
      - ./packages/shared/src:/app/packages/shared/src
      - frontend_node_modules:/app/node_modules
      - frontend_pkg_node_modules:/app/packages/frontend/node_modules

volumes:
  backend_node_modules:
  backend_pkg_node_modules:
  frontend_node_modules:
  frontend_pkg_node_modules:
