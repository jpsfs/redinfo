# Development overrides — applied automatically by Docker Compose
# Adds source volume mounts for hot-reload on both services, plus a second
# Postgres dedicated to integration tests (see `postgres-test` below).

name: redinfo

services:
  postgres:
    ports:
      - "5432:5432"  # expose DB port locally for tools like DBeaver / Prisma Studio

  # A separate server, not just a second database on `postgres`: the backend
  # container holds one `DATABASE_URL` connection pool for the whole process,
  # so a test run pointed at the same server as manual testing would still
  # need a second pool (or a connection-string swap per request) to avoid
  # racing the developer's own clicking-around. A second container sidesteps
  # that entirely, at the cost of one more `postgres:18-alpine` — cheap.
  #
  # Dev-only on purpose: this lives in the override file, which
  # `docker compose -f docker-compose.yml -f docker-compose.prod.yml` never
  # loads, so production never carries a database it has no use for.
  postgres-test:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-redinfo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redinfo_dev_password}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-redinfo_test}
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-redinfo} -d ${POSTGRES_TEST_DB:-redinfo_test}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"  # separate from the dev DB's 5432, for the odd manual look-in

  backend:
    # `TEST_DATABASE_URL` itself comes from `.env` via the base file's
    # `env_file`, same as every other backend variable that isn't
    # container-topology-specific — only the dependency on the container
    # existing at all belongs here.
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - ./packages/backend/src:/app/packages/backend/src
      - ./packages/backend/prisma:/app/packages/backend/prisma
      - ./packages/shared/src:/app/packages/shared/src
      # The backend resolves @redinfo/shared to dist/, not src/, so without this
      # mount a host-side `pnpm --filter @redinfo/shared build` never reaches the
      # running API — it silently keeps serving the dist baked into the image.
      - ./packages/shared/dist:/app/packages/shared/dist
      # Named volume to avoid overwriting container node_modules
      - backend_node_modules:/app/node_modules
      - backend_pkg_node_modules:/app/packages/backend/node_modules
    # Build shared first, so a fresh clone (empty dist/) still starts.
    #
    # `prisma generate` has to be repeated here: this `command` replaces the
    # Dockerfile's CMD, which is where it otherwise runs. Without it the
    # container keeps the client generated at image-build time, so the first
    # schema change after a build fails to compile against a stale client
    # (`Property 'x' does not exist on type 'PrismaService'`) and the API never
    # starts. The schema is bind-mounted above, so generating on every boot is
    # what keeps the client and the schema in step.
    command: >
      sh -c "[ -f /app/packages/shared/dist/index.js ] || pnpm --filter @redinfo/shared build;
             pnpm --filter backend prisma:generate;
             pnpm --filter backend dev"

  frontend:
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/frontend/index.html:/app/packages/frontend/index.html
      - ./packages/frontend/vite.config.ts:/app/packages/frontend/vite.config.ts
      - ./packages/shared/src:/app/packages/shared/src
      - frontend_node_modules:/app/node_modules
      - frontend_pkg_node_modules:/app/packages/frontend/node_modules

volumes:
  backend_node_modules:
  backend_pkg_node_modules:
  frontend_node_modules:
  frontend_pkg_node_modules:
  postgres_test_data:
