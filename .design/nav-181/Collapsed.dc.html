<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Inter", "Roboto", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #B01218; } a:hover { color: #8b0e13; }
    .ico { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .r { height: 48px; display: flex; align-items: center; justify-content: center; color: #616161; }
    .sep { height: 1px; background: #E0E0E0; margin: 6px 12px; }
  </style>
</helmet>

<div style="width: 300px; height: 870px; background: #F5F5F5; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;">
  <div style="display: flex; flex-direction: column; gap: 2px;">
    <b style="font-size: 0.875rem; font-weight: 600; color: #212121; line-height: 1.25;">Desktop, sidebar collapsed</b>
    <span style="font-size: 0.75rem; color: #616161; line-height: 1.4;">Section labels become hairlines; names come back as tooltips.</span>
  </div>

  <div style="display: flex; gap: 0; align-items: flex-start; position: relative;">
    <!-- 55px rail — react-admin's closed sidebar width -->
    <div style="width: 55px; flex: none; background: #FFFFFF; border: 1px solid #E0E0E0; border-radius: 8px; padding: 8px 0; display: flex; flex-direction: column;">
      <div style="margin: 0 6px 4px; height: 44px; border-radius: 6px; background: #B01218; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg class="ico" viewBox="0 0 24 24" style="width: 22px; height: 22px; stroke-width: 2;"><path d="M12 3v3M5.6 5.6l2.1 2.1M18.4 5.6l-2.1 2.1"/><path d="M6 20v-4a6 6 0 0112 0v4z"/><path d="M4 20h16"/></svg>
      </div>
      <div style="margin: 0 6px; height: 44px; border-radius: 6px; background: rgba(237,27,36,0.08); color: #B01218; display: flex; align-items: center; justify-content: center;">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1z"/></svg>
      </div>

      <div class="sep"></div>
      <div class="r"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3M9.5 14.5l2 2 3.5-4"/></svg></div>
      <div class="r"><svg class="ico" viewBox="0 0 24 24"><rect x="4.5" y="4" width="15" height="16" rx="2"/><path d="M9 4V2.5h6V4"/><path d="M8.5 10.5h7M8.5 14.5h4"/></svg></div>
      <div class="r"><svg class="ico" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h4"/></svg></div>

      <div class="sep"></div>
      <div class="r"><svg class="ico" viewBox="0 0 24 24"><path d="M3 12h3.5l1.5-3.5 2.5 7 2-5 1.5 3h3"/><path d="M18 5.5a3 3 0 013 3c0 3.5-4.5 6-6 7.5"/></svg></div>
      <div class="r"><svg class="ico" viewBox="0 0 24 24"><path d="M8 2.5h6l4 4v12H8z"/><path d="M14 2.5v4h4M5.5 6v15.5H16"/></svg></div>
      <div class="r"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3M7.5 13h4M7.5 16.5h9"/></svg></div>
      <div class="r"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3M7 14h10"/></svg></div>

      <div class="sep"></div>
      <div class="r"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3 2.7-5 6-5s6 2 6 5"/><path d="M16 6.2a3.2 3.2 0 010 6M17.5 19c0-2.4-.9-3.9-2-4.6"/></svg></div>

      <div class="sep"></div>
      <div class="r"><svg class="ico" viewBox="0 0 24 24"><path d="M2.5 15v-3.5l2-4.5h10v8"/><path d="M14.5 9H19l2.5 3.5V15"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 17h6"/></svg></div>
      <div class="r"><svg class="ico" viewBox="0 0 24 24"><path d="M3.5 8.5L12 4l8.5 4.5v7L12 20l-8.5-4.5z"/><path d="M3.5 8.5L12 13l8.5-4.5M12 13v7"/></svg></div>

      <div class="sep"></div>
      <div class="r"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20V8l8-4 8 4v12"/><path d="M10 12h4M12 10v4M9 20v-4h6v4"/></svg></div>
      <div class="r"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3M10 13l4 4M14 13l-4 4"/></svg></div>
    </div>

    <!-- Tooltip on the Emergência rail item -->
    <div style="position: absolute; left: 63px; top: 14px; background: #212121; color: #FFFFFF; font-size: 0.75rem; font-weight: 500; padding: 6px 10px; border-radius: 4px; white-space: nowrap;">Emergência · modo em campo</div>
  </div>
</div>
</x-dc>
</body>
</html>
