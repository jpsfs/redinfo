<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Inter", "Roboto", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #B01218; } a:hover { color: #8b0e13; }
    .ico { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; background: #F5F5F5; overflow: hidden;">

  <!-- Page behind the drawer -->
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column;">
    <div style="height: 56px; flex: none; background: #ED1B24;"></div>
    <div style="flex-grow: 1; padding: 16px;">
      <div style="height: 120px; background: #FFFFFF; border-radius: 8px;"></div>
    </div>
  </div>

  <!-- Scrim -->
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.5);"></div>

  <!-- Temporary drawer -->
  <div style="position: absolute; top: 0; left: 0; bottom: 0; width: 296px; background: #FFFFFF; box-shadow: 4px 0 24px rgba(0,0,0,0.28); display: flex; flex-direction: column; overflow: hidden;">

    <!-- Drawer header: who you are, one tap to your profile -->
    <div style="flex: none; height: 96px; background: #ED1B24; color: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 16px;">
      <div style="width: 48px; height: 48px; flex: none; border-radius: 24px; background: #B01218; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 600;">JS</div>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
        <div style="font-size: 0.9375rem; font-weight: 600; line-height: 1.25;">José Silva</div>
        <div style="font-size: 0.75rem; line-height: 1.5; opacity: 0.9;">System Administrator</div>
      </div>
      <div style="flex-grow: 1;"></div>
      <svg class="ico" viewBox="0 0 24 24" style="width: 18px; height: 18px;"><path d="M9 6l6 6-6 6"/></svg>
    </div>

    <!-- Scrolling menu -->
    <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; padding: 8px 0 0;">

      <div style="margin: 0 8px 4px; height: 60px; border-radius: 8px; background: #B01218; color: #FFFFFF; display: flex; align-items: center; gap: 14px; padding: 0 14px;">
        <svg class="ico" viewBox="0 0 24 24" style="width: 26px; height: 26px; stroke-width: 2;"><path d="M12 3v3M5.6 5.6l2.1 2.1M18.4 5.6l-2.1 2.1"/><path d="M6 20v-4a6 6 0 0112 0v4z"/><path d="M4 20h16"/></svg>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 1.0625rem; font-weight: 700; line-height: 1.25; letter-spacing: 0.01em;">Emergência</span>
          <span style="font-size: 0.75rem; font-weight: 500; line-height: 1.25; opacity: 0.85;">Modo em campo</span>
        </div>
      </div>

      <div style="margin: 0 8px; height: 48px; border-radius: 8px; background: rgba(237,27,36,0.08); color: #B01218; display: flex; align-items: center; gap: 14px; padding: 0 14px;">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1z"/></svg>
        <span style="font-size: 1rem; font-weight: 600;">Home</span>
      </div>

      <div style="height: 32px; display: flex; align-items: flex-end; padding: 0 22px 4px; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #616161;">My work</div>
      <div style="margin: 0 8px; height: 48px; border-radius: 8px; display: flex; align-items: center; gap: 14px; padding: 0 14px; color: #212121;">
        <svg class="ico" viewBox="0 0 24 24" style="color: #616161;"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3M9.5 14.5l2 2 3.5-4"/></svg>
        <span style="font-size: 1rem;">My Availability</span>
      </div>
      <div style="margin: 0 8px; height: 48px; border-radius: 8px; display: flex; align-items: center; gap: 14px; padding: 0 14px; color: #212121;">
        <svg class="ico" viewBox="0 0 24 24" style="color: #616161;"><rect x="4.5" y="4" width="15" height="16" rx="2"/><path d="M9 4V2.5h6V4"/><path d="M8.5 10.5h7M8.5 14.5h4"/></svg>
        <span style="font-size: 1rem;">My Duties</span>
      </div>
      <div style="margin: 0 8px; height: 48px; border-radius: 8px; display: flex; align-items: center; gap: 14px; padding: 0 14px; color: #212121;">
        <svg class="ico" viewBox="0 0 24 24" style="color: #616161;"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h4"/></svg>
        <span style="font-size: 1rem;">My Reports</span>
      </div>

      <div style="height: 32px; display: flex; align-items: flex-end; padding: 0 22px 4px; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #616161;">Operations</div>
      <div style="margin: 0 8px; height: 48px; border-radius: 8px; display: flex; align-items: center; gap: 14px; padding: 0 14px; color: #212121;">
        <svg class="ico" viewBox="0 0 24 24" style="color: #616161;"><path d="M3 12h3.5l1.5-3.5 2.5 7 2-5 1.5 3h3"/><path d="M18 5.5a3 3 0 013 3c0 3.5-4.5 6-6 7.5"/></svg>
        <span style="font-size: 1rem;">Live Emergencies</span>
      </div>
      <div style="margin: 0 8px; height: 48px; border-radius: 8px; display: flex; align-items: center; gap: 14px; padding: 0 14px; color: #212121;">
        <svg class="ico" viewBox="0 0 24 24" style="color: #616161;"><path d="M8 2.5h6l4 4v12H8z"/><path d="M14 2.5v4h4M5.5 6v15.5H16"/></svg>
        <span style="font-size: 1rem;">Event Reports</span>
        <div style="flex-grow: 1;"></div>
        <span style="font-size: 0.6875rem; font-weight: 600; color: #FFFFFF; background: #9E9E9E; border-radius: 10px; padding: 2px 7px;">12</span>
      </div>
      <div style="margin: 0 8px; height: 48px; border-radius: 8px; display: flex; align-items: center; gap: 14px; padding: 0 14px; color: #212121;">
        <svg class="ico" viewBox="0 0 24 24" style="color: #616161;"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3M7.5 13h4M7.5 16.5h9"/></svg>
        <span style="font-size: 1rem;">Schedules</span>
      </div>
      <div style="margin: 0 8px; height: 48px; border-radius: 8px; display: flex; align-items: center; gap: 14px; padding: 0 14px; color: #212121;">
        <svg class="ico" viewBox="0 0 24 24" style="color: #616161;"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/><path d="M7 14h10"/></svg>
        <span style="font-size: 1rem;">Availability Windows</span>
      </div>

      <div style="height: 32px; display: flex; align-items: flex-end; padding: 0 22px 4px; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #616161;">People</div>
      <div style="margin: 0 8px; height: 48px; border-radius: 8px; display: flex; align-items: center; gap: 14px; padding: 0 14px; color: #212121;">
        <svg class="ico" viewBox="0 0 24 24" style="color: #616161;"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3 2.7-5 6-5s6 2 6 5"/><path d="M16 6.2a3.2 3.2 0 010 6M17.5 19c0-2.4-.9-3.9-2-4.6"/></svg>
        <span style="font-size: 1rem;">Personnel</span>
        <div style="flex-grow: 1;"></div>
        <span style="font-size: 0.6875rem; font-weight: 600; color: #FFFFFF; background: #F57C00; border-radius: 10px; padding: 2px 7px;">3</span>
      </div>

      <div style="height: 32px; display: flex; align-items: flex-end; padding: 0 22px 4px; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #616161;">Fleet</div>
      <div style="margin: 0 8px; height: 48px; border-radius: 8px; display: flex; align-items: center; gap: 14px; padding: 0 14px; color: #212121;">
        <svg class="ico" viewBox="0 0 24 24" style="color: #616161;"><path d="M2.5 15v-3.5l2-4.5h10v8"/><path d="M14.5 9H19l2.5 3.5V15"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 17h6M2.5 15h2M21.5 15v2h-2.5"/></svg>
        <span style="font-size: 1rem;">Vehicles</span>
      </div>
      <div style="margin: 0 8px; height: 48px; border-radius: 8px; display: flex; align-items: center; gap: 14px; padding: 0 14px; color: #212121;">
        <svg class="ico" viewBox="0 0 24 24" style="color: #616161;"><path d="M3.5 8.5L12 4l8.5 4.5v7L12 20l-8.5-4.5z"/><path d="M3.5 8.5L12 13l8.5-4.5M12 13v7"/></svg>
        <span style="font-size: 1rem;">Inventory Templates</span>
      </div>

      <!-- Clipped by the viewport: Configuration is below the fold and scrolls -->
      <div style="height: 32px; display: flex; align-items: flex-end; padding: 0 22px 4px; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #616161;">Configuration</div>
      <div style="margin: 0 8px; height: 48px; border-radius: 8px; display: flex; align-items: center; gap: 14px; padding: 0 14px; color: #212121;">
        <svg class="ico" viewBox="0 0 24 24" style="color: #616161;"><path d="M4 20V8l8-4 8 4v12"/><path d="M10 12h4M12 10v4M9 20v-4h6v4"/></svg>
        <span style="font-size: 1rem;">Hospitals</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
