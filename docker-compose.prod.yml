# Production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

name: redinfo

services:
  postgres:
    restart: always
    # Do NOT expose DB port in production

  backend:
    build:
      target: prod
    restart: always
    environment:
      NODE_ENV: production
      FRONTEND_URL: http://localhost
    # Entrypoint in the image handles: prisma migrate deploy → node dist/main
    expose:
      - "3000"

  frontend:
    build:
      target: prod
      args:
        VITE_API_URL: /api
        # Bakes in the real production branding at build time so a local
        # `docker compose -f ... -f docker-compose.prod.yml up` preview looks
        # like the real thing rather than the dev default. The deployed
        # production environment no longer builds its own image this way —
        # one frontend image is promoted staging → production and gets its
        # title (APP_TITLE, same "CVP Portal" value) at container start
        # instead; see deploy/redinfo/values.production.yaml and
        # packages/frontend/docker-entrypoint-app-title.sh.
        VITE_APP_TITLE: "CVP Portal"
    restart: always
    ports:
      - "80:80"
      - "443:443"    # TLS termination to be handled externally (e.g. Traefik / certbot)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
