<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ED1B24" />
    <!--
      __APP_TITLE__ is substituted by the injectAppTitle plugin in
      vite.config.ts, from the VITE_APP_TITLE env var (see .env.example and
      packages/frontend/Dockerfile), so the tab title reads "RedInfo - Dev" /
      "RedInfo - QA" / "CVP Portal" depending on which environment's image
      this is. manifest.webmanifest's name/short_name carry the same token.
    -->
    <title>__APP_TITLE__</title>
    <!--
      Inter, self-hosted. Served from our own origin rather than
      fonts.googleapis.com because live mode is a PWA that has to open with no
      network: a third-party stylesheet cannot be cached by our service worker,
      and the shell would come up unstyled exactly when a crew cannot afford it.
    -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/inter.css" />

    <!-- Installable: a crew opens this from the home screen, not from a tab. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="__APP_TITLE__" />
    <meta name="description" content="Registo de ocorrências e emergências em direto." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
