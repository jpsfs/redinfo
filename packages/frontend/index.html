<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ED1B24" />
    <!--
      __APP_TITLE__ is substituted by the injectAppTitle plugin in
      vite.config.ts, from the VITE_APP_TITLE env var (see .env.example and
      packages/frontend/Dockerfile), so the tab title reads "RedInfo - Dev" /
      "RedInfo - QA" / "CVP Portal" depending on which environment's image
      this is. manifest.webmanifest's name/short_name carry the same token.
    -->
    <title>__APP_TITLE__</title>
    <!--
      Publishes the resolved title as a global so JS (LoginPage.tsx) can read
      it without it being baked into the bundle. Named window.APP_TITLE
      (NOT window.__APP_TITLE__) deliberately: substitution below is a plain
      text replace of the __APP_TITLE__ placeholder (both here and in the
      nginx entrypoint's sed), and if the property name itself contained
      that literal substring, substituting the value would mangle the
      property name too (window.CVP Portal = 'CVP Portal';). Left as the
      literal placeholder when nothing rewrites it: vite's injectAppTitle
      plugin substitutes it in dev and in a build with VITE_APP_TITLE
      explicitly set; otherwise it survives into dist/ and the nginx
      entrypoint (docker-entrypoint-app-title.sh) substitutes it at
      container start instead, from that environment's APP_TITLE — the same
      image then serves every environment.
    -->
    <script>window.APP_TITLE = '__APP_TITLE__';</script>
    <!--
      Inter, self-hosted. Served from our own origin rather than
      fonts.googleapis.com because live mode is a PWA that has to open with no
      network: a third-party stylesheet cannot be cached by our service worker,
      and the shell would come up unstyled exactly when a crew cannot afford it.
    -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/inter.css" />

    <!-- Installable: a crew opens this from the home screen, not from a tab. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="__APP_TITLE__" />
    <meta name="description" content="Registo de ocorrências e emergências em direto." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
